# 3D 디지털판(P2P)을 GitHub Pages에 올린다. main에 푸시하면 빌드해서 배포.
# 저장소 Settings → Pages → Source = "GitHub Actions" (설정 완료). 주소: https://i-cubic-i.github.io/cubic3/
name: Pages
on:
  push:
    branches: [main]
    paths: ['game/src/**', 'proto/web/index.html', 'tools/buildgame.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/buildgame.py --pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist/pages
      - id: deployment
        uses: actions/deploy-pages@v4
