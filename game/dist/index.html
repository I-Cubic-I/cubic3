<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>큐빅 파티 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=VT323&display=swap">
<style>
:root{
  --room:#14110e; --felt:#1f4c3f; --wood:#5b3b23; --brass:#e8b84a; --brass-ink:#1b1408;
  --ivory:#f7f3ea; --ink:#f3ece2; --muted:#b9ad9c; --dim:#7d7365;
  --glass:rgba(18,16,14,.8); --glass-strong:rgba(18,16,14,.92); --line:rgba(255,255,255,.12);
  --S:#2f5fc8; --H:#d3302f; --D:#b98a00; --C:#2e9450; --Dbg:#e0b100;
  --scr:#0c1622; --scr2:#1d3550; --cyan:#7fe3ff; --cyan-dim:#b8d9ec; --alert:#ff4d4d;
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--room);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
#gl{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#hud .pe,#hud button,#hud [data-a],#hud [data-h]{pointer-events:auto}
.disp{font-family:'Black Han Sans','IBM Plex Sans KR',sans-serif;font-weight:400}
.mono{font-family:'VT323',ui-monospace,monospace}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{border-color:var(--brass);color:var(--brass)}
.btn{min-height:44px;padding:0 18px;border-radius:14px;background:var(--glass);border:1px solid rgba(255,255,255,.18);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--brass);color:var(--brass-ink);border:0;box-shadow:0 8px 24px rgba(232,184,74,.28)}
.btn.danger{border-color:rgba(255,90,90,.5);color:#ffb3b3}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:focus-visible,.hcard:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}

/* top bar */
.topl{position:absolute;left:20px;top:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:44vw}
.logo{font-family:'Black Han Sans',sans-serif;font-size:26px;color:var(--brass);letter-spacing:.5px}
.topr{position:absolute;right:20px;top:18px;display:flex;gap:8px}
.prompt{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;max-width:min(680px,92vw)}
.pill{padding:10px 22px;border-radius:999px;background:var(--brass);color:var(--brass-ink);font-size:18px;font-weight:700;box-shadow:0 8px 24px rgba(232,184,74,.3);text-align:center}
.pill.wait{background:var(--glass-strong);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:500}
.subchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.subchips .chip{font-size:13px;padding:3px 10px;color:var(--muted)}
.subchips .chip.on{color:var(--brass)}

/* name plates over 3D avatars */
.plate{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(18,16,14,.82);border:1px solid var(--line);font-size:14px;white-space:nowrap;pointer-events:auto;transition:opacity .2s}
.plate.turn{border:2px solid var(--brass);box-shadow:0 0 18px rgba(232,184,74,.45)}
.plate.out{opacity:.45}
.plate .dot{width:10px;height:10px;border-radius:50%}
.plate .toks{display:flex;gap:3px}
.tok{display:inline-block;width:12px;height:12px;border-radius:3px}
.tok.S{background:var(--S)}.tok.H{background:var(--H)}.tok.D{background:var(--Dbg)}.tok.C{background:var(--C)}
.plate.target{cursor:pointer;border-color:#ff8080;box-shadow:0 0 0 3px rgba(255,80,80,.35)}

/* hand overlay */
.hand{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(860px,100vw);height:230px;pointer-events:none}
.hand.tuck{height:0}
.hcard{position:absolute;bottom:-34px;width:118px;height:166px;border-radius:12px;background:var(--ivory);border:1px solid #d8d1c4;color:#1b2230;font-family:'Black Han Sans',sans-serif;box-shadow:0 14px 30px rgba(0,0,0,.5);transform-origin:50% 120%;transition:transform .22s cubic-bezier(.2,.9,.3,1.2),box-shadow .2s;pointer-events:auto;cursor:pointer;user-select:none}
.hcard .rk{position:absolute;left:10px;top:8px;font-size:26px;line-height:1}
.hcard .su{position:absolute;left:0;right:0;top:44px;text-align:center;font-size:62px;line-height:1}
.hcard .tg{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-family:'IBM Plex Sans KR',sans-serif;font-size:12px;font-weight:700;color:#8a6a10}
.hcard.S{color:var(--S)}.hcard.H{color:var(--H)}.hcard.D{color:var(--D)}.hcard.C{color:var(--C)}
.hcard.item{border:3px solid var(--brass);box-shadow:0 0 0 4px rgba(232,184,74,.3),0 14px 30px rgba(0,0,0,.5)}
.hcard.sel{box-shadow:0 0 0 4px var(--cyan),0 18px 34px rgba(0,0,0,.55)}
.hcard.dim{filter:grayscale(.6) brightness(.7)}
.hcard.new{animation:dealin .45s ease-out}
@keyframes dealin{from{opacity:0;transform:translateY(80px) rotate(0)}}
.handbtn{position:absolute;right:20px;bottom:20px}
.tray{position:absolute;left:20px;bottom:22px;display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.tray .lbl{font-size:13px;color:var(--muted)}
.tray .row{display:flex;gap:8px;align-items:center}
.cube{width:30px;height:30px;border-radius:7px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.cube.S{background:var(--S)}.cube.H{background:var(--H)}.cube.D{background:var(--Dbg)}.cube.C{background:var(--C)}
.cube.empty{border:2px dashed rgba(255,255,255,.25);box-shadow:none}
.acts{position:absolute;right:20px;bottom:22px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:320px}
.acts .note{font-size:12px;color:var(--muted);text-align:right}
.acts .group{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

/* generic panel */
.panel{background:var(--glass-strong);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.center-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:80vh;overflow:auto;pointer-events:auto}
.mini-cards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mcard{width:54px;height:76px;border-radius:7px;background:var(--ivory);color:#1b2230;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Black Han Sans',sans-serif;font-size:22px;line-height:1;box-shadow:0 6px 12px rgba(0,0,0,.35);border:2px solid transparent}
.mcard small{font-size:18px}
.mcard.S{color:var(--S)}.mcard.H{color:var(--H)}.mcard.D{color:var(--D)}.mcard.C{color:var(--C)}
.mcard.back{background:linear-gradient(135deg,#2c3d60,#1b2640);border-color:var(--brass);color:var(--brass)}
.mcard.click{cursor:pointer}.mcard.click:hover{transform:translateY(-4px)}
.mcard.sel{border-color:var(--cyan)}

/* lobby */
.lobby{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);pointer-events:auto;text-align:center}
.lobby h1{margin:0 0 4px;font-family:'Black Han Sans',sans-serif;font-size:44px;color:var(--brass);font-weight:400}
.lobby p{color:var(--muted);font-size:14px;line-height:1.6}
.seatlist{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.seatrow{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.05)}
.seatrow .who{display:flex;align-items:center;gap:10px}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* rules screen = the monitor screen filling the page */
.screen{position:absolute;inset:0;pointer-events:none;visibility:hidden;background:#0a0908;opacity:0;transition:opacity .45s,visibility 0s .45s}
.screen.show{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .45s}
.screen .crt{position:absolute;inset:10px;border-radius:28px;background:radial-gradient(ellipse at 50% 40%,#213f60,var(--scr) 80%);overflow:hidden;color:#eaf6ff}
.screen .crt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px);pointer-events:none}
.screen .crt::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(0,0,0,.65);pointer-events:none}
.scr-top{position:absolute;left:40px;right:40px;top:28px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.scr-top .mono{font-size:30px;letter-spacing:4px;color:var(--cyan);text-shadow:0 0 10px rgba(127,227,255,.8)}
.scr-chip{padding:6px 14px;border-radius:999px;border:1px solid rgba(127,227,255,.35);font-size:14px;color:var(--cyan-dim)}
.scr-body{position:absolute;left:40px;right:40px;top:96px;bottom:200px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px}
.scr-art{border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#1e2b4a;box-shadow:0 0 0 3px rgba(127,227,255,.25),0 30px 60px rgba(0,0,0,.45);padding:20px;min-height:0}
.scr-art .glyph{font-size:110px;line-height:1}
.scr-art .ttl{font-family:'Black Han Sans',sans-serif;font-size:60px;line-height:1.05;text-align:center}
.scr-art .tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.scr-art .tags span{padding:6px 14px;border-radius:999px;background:rgba(30,43,74,.12);font-size:15px;font-weight:700}
.scr-rules{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.rrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:start;padding:16px 20px;border-radius:18px;background:rgba(8,16,28,.55);border:1px solid rgba(127,227,255,.18)}
.rrow b{padding:5px 0;border-radius:10px;text-align:center;font-family:'Black Han Sans',sans-serif;font-size:20px;font-weight:400;background:var(--cyan);color:var(--scr)}
.rrow.it b{background:var(--brass);color:var(--brass-ink)}
.rrow span{font-size:19px;line-height:1.55}
.scr-foot{position:absolute;left:40px;right:40px;bottom:30px;height:150px;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr) minmax(0,340px);gap:16px}
.scr-box{border-radius:18px;background:rgba(8,16,28,.6);border:1px solid rgba(127,227,255,.18);padding:12px 16px;display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}
.scr-box .lbl{font-size:13px;letter-spacing:1px;color:var(--cyan)}
.readys{display:flex;flex-wrap:wrap;gap:8px}
.ready{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 7px;border-radius:999px;background:rgba(255,255,255,.08);font-size:14px;font-weight:700;color:var(--cyan-dim)}
.ready.ok{background:#5bd47a;color:var(--scr)}
.ready i{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.clubbox{border-color:rgba(232,184,74,.5);flex-direction:row;align-items:center;gap:12px}
.clubbox .mcard{flex:none}
.clubbox .txt{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--cyan-dim);line-height:1.45}
.clubbox .txt strong{font-size:15px;color:#ffe2a0}
.clubbtns{display:flex;flex-wrap:wrap;gap:6px}
.rewardrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.rewardrow .mcard{width:30px;height:42px;font-size:12px;border-radius:5px}
.rewardrow .mcard small{font-size:10px}
.readybtn{flex:1;min-height:56px;border-radius:16px;border:0;background:var(--brass);color:var(--brass-ink);font-size:20px;font-weight:700;box-shadow:0 0 24px rgba(232,184,74,.45)}
/* ♣: the monitor reacts — red rounded frame, floppy with X */
.screen .alert{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,#1d3550,var(--scr) 78%)}
.screen.alerting .alert{display:flex}
.alert .frame{position:relative;width:min(640px,70vw);height:min(420px,46vh);border-radius:40px;border:7px solid var(--alert);box-shadow:0 0 24px rgba(255,77,77,.7),inset 0 0 24px rgba(255,77,77,.35);display:flex;align-items:center;justify-content:center;animation:blink .9s steps(2) infinite}
@keyframes blink{50%{border-color:rgba(255,77,77,.55)}}
.alert svg{width:min(240px,30vw);height:auto;filter:drop-shadow(0 0 14px rgba(255,77,77,.75))}
/* cut-in — separate from the monitor (table HUD style) */
.cutin{position:absolute;inset:0;display:none;pointer-events:none}
.cutin.show{display:block}
.cutin .shade{position:absolute;inset:0;background:rgba(8,6,4,.62);animation:fadein .25s}
.cutin .band{position:absolute;left:0;right:0;top:50%;height:min(400px,60vh);transform:translateY(-50%);background:linear-gradient(90deg,rgba(20,17,14,0),rgba(20,17,14,.96) 22%,rgba(20,17,14,.96) 78%,rgba(20,17,14,0));animation:bandin .35s cubic-bezier(.2,.9,.3,1)}
.cutin .band::before,.cutin .band::after{content:"";position:absolute;left:12%;right:12%;height:3px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.cutin .band::before{top:0}.cutin .band::after{bottom:0}
.cutin .who{position:absolute;left:50%;top:calc(50% - min(170px,26vh));transform:translateX(-50%);display:flex;align-items:center;gap:14px;white-space:nowrap;animation:slidein .45s cubic-bezier(.2,.9,.3,1)}
.cutin .who .av{width:60px;height:60px;border-radius:50%;box-shadow:0 0 0 3px var(--ink)}
.cutin .who .nm{font-family:'Black Han Sans',sans-serif;font-size:clamp(36px,6vw,64px);line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.5)}
.cutin .card{position:absolute;left:50%;top:50%;width:150px;height:210px;margin:-95px 0 0 -75px;border-radius:14px;background:var(--ivory);border:4px solid var(--brass);box-shadow:0 0 0 8px rgba(232,184,74,.3),0 0 50px rgba(232,184,74,.55),0 24px 40px rgba(0,0,0,.6);font-family:'Black Han Sans',sans-serif;animation:cardin .55s cubic-bezier(.2,1.2,.3,1)}
.cutin .card .rk{position:absolute;left:12px;top:10px;font-size:36px;line-height:1}
.cutin .card .s1{position:absolute;left:13px;top:48px;font-size:26px;line-height:1}
.cutin .card .s2{position:absolute;left:0;right:0;top:70px;text-align:center;font-size:96px;line-height:1}
.cutin .eff{position:absolute;left:50%;top:calc(50% + 135px);transform:translateX(-50%);padding:8px 20px;border-radius:999px;background:var(--brass);color:var(--brass-ink);font-size:20px;font-weight:700;white-space:nowrap;animation:fadein .5s .15s both}
@keyframes fadein{from{opacity:0}}
@keyframes bandin{from{transform:translateY(-50%) scaleY(0)}}
@keyframes slidein{from{opacity:0;transform:translateX(-50%) translateX(-80px)}}
@keyframes cardin{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{transform:rotate(-4deg)}}

/* minigame HUD */
.mg{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(640px,94vw);pointer-events:auto;padding:12px 16px}
.mg .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.mg .head .disp{font-size:22px;color:var(--brass)}
.mg .stage{gap:10px}
.door{width:76px;height:84px;font-size:36px}
.mg .stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.mg .line{font-size:15px;text-align:center;line-height:1.5}
.mg .line strong{color:var(--brass)}
.mg .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mg .chips .chip{font-size:13px}
.mg .chips .chip.out{opacity:.45;text-decoration:line-through}
.mg .chips .chip.lead{border-color:#e07a2e;color:#ffb35c}
.bigbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.handbtnbig{width:96px;height:96px;border-radius:18px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px}
.handbtnbig span{font-size:40px;line-height:1}
.handbtnbig.on{border-color:var(--brass);background:rgba(232,184,74,.15)}
.balloon{position:relative;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:inset -18px -22px 0 rgba(0,0,0,.14),inset 12px 12px 0 rgba(255,255,255,.28),0 20px 40px rgba(0,0,0,.45);transition:width .5s cubic-bezier(.2,1.4,.4,1),height .5s cubic-bezier(.2,1.4,.4,1),background .5s}
.balloon b{font-family:'Black Han Sans',sans-serif;font-size:54px;line-height:1;font-weight:400}
.balloon small{font-size:14px;font-weight:700;opacity:.85}
.lanes{display:flex;flex-direction:column;gap:6px;width:100%}
.lane{display:grid;grid-template-columns:34px repeat(5,minmax(0,1fr)) 90px;gap:4px;align-items:center}
.lane .ln{font-size:24px;text-align:center}
.lane .cell{height:36px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim)}
.lane .cell.goal{background:rgba(232,184,74,.15)}
.lane .horse{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;box-shadow:0 4px 8px rgba(0,0,0,.4)}
.lane .riders{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doors{display:flex;gap:12px;justify-content:center}
.door{width:96px;height:120px;border-radius:14px;background:linear-gradient(180deg,#3a414c,#22272e);border:2px solid rgba(255,255,255,.15);font-family:'Black Han Sans',sans-serif;font-size:44px;color:var(--ink)}
.door.on{border-color:#ff8080;box-shadow:0 0 0 4px rgba(255,80,80,.35)}
.nums{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.num{width:52px;height:52px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-family:'Black Han Sans',sans-serif;font-size:24px}
.bigflip{width:120px;height:168px;border-radius:12px;background:var(--ivory);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Black Han Sans',sans-serif;font-size:48px;line-height:1;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.bigflip.S{color:var(--S)}.bigflip.H{color:var(--H)}.bigflip.D{color:var(--D)}.bigflip.C{color:var(--C)}
.bigflip.flip{animation:flipin .35s ease-out}
@keyframes flipin{from{transform:rotateY(90deg)}}
.itemtray{position:absolute;left:20px;bottom:22px;display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);pointer-events:auto}
.itemtray .lbl{font-size:13px;color:var(--muted)}
.itemtray .row{display:flex;gap:8px}
.itemtray .mcard{width:60px;height:84px;font-size:24px;border:3px solid var(--brass);cursor:pointer}
.itemtray .mcard.sel{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(127,227,255,.35)}

/* fx overlays */
.fx{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 34px;border-radius:22px;background:var(--glass-strong);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:fxin .35s cubic-bezier(.2,1.3,.3,1);text-align:center;max-width:90vw;pointer-events:none}
.fx.out{animation:fxout .25s forwards}
@keyframes fxin{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
@keyframes fxout{to{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
.fx .k{font-size:14px;letter-spacing:2px;color:var(--brass)}
.fx .b{font-family:'Black Han Sans',sans-serif;font-size:clamp(34px,6vw,58px);line-height:1.05}
.fx .s{font-size:16px;color:var(--muted)}
.fx.bad{border-color:rgba(255,90,90,.6)}.fx.bad .b{color:#ff8a8a}

<body>
<canvas id="gl" aria-label="게임 테이블"></canvas>
<div id="hud"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= 엔진 (순수 함수: 상태를 받아 고친다) ================= */
const SUITS=['S','H','D','C'];
const SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
const SNAME={S:'스페이드',H:'하트',D:'다이아',C:'클럽'};
const R=c=>parseInt(c.slice(1),10), U=c=>c[0];
const isItem=c=>R(c)>=11;
const RL=r=>({1:'A',11:'J',12:'Q',13:'K'}[r]||String(r));
const cname=c=>SYM[U(c)]+RL(R(c));
const CLUB_MS=5000, DEF_MS=6000;
let RNG=Math.random;
const rnd=n=>Math.floor(RNG()*n);
const d6=()=>1+rnd(6);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function fullDeck(decks=1){const d=[];for(let k=0;k<decks;k++)for(const s of SUITS)for(let r=1;r<=13;r++)d.push(s+r+(k?'b':''));return d}

const MG={
  hold:{name:'버티기',min:2,max:5,icon:'🎲',
    text:'준비: 각자에게 주사위 1개를 준다.\n진행: 차례대로 주사위를 원하는 만큼 굴려, 나온 눈만큼 점수를 쌓는다. 1이 나오면 이번 판 점수를 모두 잃는다. 한 번 더 굴리려면 이 기준이 1 오른다. 멈추면 점수 확정. 모두 한 번씩 하면 1판.\n순위: 3판 합계.\n아이템: 굴리기 전에 낸다. 이번엔 2번 굴려 높은 쪽을 쓴다.'},
  bomb:{name:'폭탄 버튼',min:2,max:5,icon:'🂠 1+1×👥',
    text:'준비: 덱에서 남은 인원 + 1장을 뒷면으로 깐다.\n진행: 선부터 차례로 1장을 골라 내 앞에 뒤집는다. 모두 뒤집으면 가장 높은 카드를 뒤집은 사람이 탈락(같으면 모두 탈락). 깐 카드를 덱에 섞고 새로 깐다. 1명이 남을 때까지. 단, 2명만 남으면 폭탄을 2번 먼저 맞은 사람이 탈락.\n순위: 먼저 탈락한 사람이 낮은 순위.\n아이템: 뒤집기 전에 낸다. 내 카드는 3을 뺀 숫자로 친다.'},
  auction:{name:'눈치 경매',min:2,max:5,icon:'🂠 5+5×👥',
    text:'준비: 각자 5장을 손패로 쥔다. 상품 5장을 한 줄로 깔고 앞의 3장만 앞면.\n진행: 왼쪽 상품부터 공개 후 경매. 모두 손패 1장을 뒷면으로 내고 동시에 연다. 같은 숫자는 서로 지워진다. 남은 사람 중 가장 높은 사람이 상품을 가져간다. 아무도 없으면 상품은 다음 경매에 얹힌다. 낸 카드는 버린다. 5번 반복.\n순위: 가져간 상품 숫자의 합.\n아이템: 경매 전에 낸다. 1장마다 다음 상품이 하나씩 이번 경매에 함께 걸린다.'},
  balloon:{name:'풍선 불기',min:2,max:5,icon:'🂠 3×👥',
    text:'준비: 덱에서 각자 3장을 받아 혼자 본다.\n진행: 차례대로 손패 1장을 가운데에 내며 지금까지의 합을 말하고, 덱에서 1장을 보충한다. 합이 50을 넘기게 한 사람이 탈락. 가운데 카드를 덱에 섞고, 남은 사람끼리 손패를 그대로 들고 합 0부터 다시. 1명이 남을 때까지.\n순위: 먼저 탈락한 사람이 낮은 순위.\n아이템: 낼 때 같이 낸다. 이번엔 내 카드를 빼서 합을 줄인다.'},
  rps:{name:'선 가위바위보',min:2,max:5,icon:'✊',
    text:'준비: 없음.\n진행: 모두 동시에 가위바위보를 낸다. 각자 선의 손과만 비교해, 선에게 진 사람은 탈락하고 이기거나 비긴 사람은 남는다. 선이 아닌 사람 수 + 1판 동안.\n순위: 모두 탈락시키면 선 1위. 아니면 남은 사람이 공동 1위, 선 꼴찌. 탈락한 사람은 늦게 탈락한 순서.\n아이템(임시): 선이 아닐 때는 졌을 때 낸다. 이번엔 탈락하지 않는다. 선은 내기 전에 낸다. 이번엔 비긴 사람도 탈락한다.'},
  vault:{name:'금고 털기',min:2,max:5,icon:'1·2·3',
    text:'준비: 선이 경비원, 나머지는 도둑.\n진행: 경비원이 못 보는 사이 도둑은 1·2·3번 금고 중 하나에 숨는다. 경비원이 금고 하나를 고른다. 그 금고의 도둑은 잡혀서 빠진다. 도둑 수 + 1판 동안.\n순위: 도둑을 모두 잡으면 경비원 1위. 아니면 살아남은 도둑이 공동 1위, 경비원 꼴찌. 잡힌 도둑은 늦게 잡힌 순서.\n아이템: 도둑은 잡혔을 때 낸다. 이번엔 빠지지 않는다. 경비원은 고를 때 낸다. 금고 2곳을 고른다.'},
  count:{name:'몇 장이었지',min:2,max:5,icon:'🂠 12',
    text:'준비: 각자에게 주사위 1개를 준다.\n진행: 덱에서 12장을 1초에 1장씩 넘긴다. 모두 문양별 장수를 센다. 다 넘기면 1장을 더 뒤집는다. 그 카드의 문양이 정답 문양. 각자 그 문양의 장수를 골라 함께 연다(7장 이상이면 6). 맞힌 사람 1점. 3판.\n순위: 맞힌 횟수.\n아이템: 열기 전에 낸다. 정답과 1 차이도 맞힌 걸로 친다.'},
  race:{name:'문양 경주',min:2,max:5,icon:'🂠 15',
    text:'준비: 판 뒷면의 1·2·3 구역 바깥에 문양 색 말 4개를 둔다.\n진행: 선부터 차례로 우승할 문양 하나를 고른다(겹쳐도 된다). 선이 덱에서 한 장씩 뒤집는다. 숫자 카드면 그 문양이 한 구역 앞으로, J·Q·K면 한 구역 뒤로. 최대 15장. 3번 구역에서 판 밖으로 먼저 나간 문양이 우승. 15장을 다 뒤집으면 가장 앞선 문양이 우승(같으면 공동).\n순위: 우승 문양을 고른 사람이 모두 1위, 나머지는 고른 문양이 간 거리 순서.\n아이템: 카드를 뒤집기 전에 낸다. 내가 고른 문양을 바꾼다.'}
};

function log(S,msg){S.log.unshift(msg);if(S.log.length>80)S.log.length=80}
function N(S){return S.seats.length}
function tokCount(S,i){return S.seats[i].tokens.length}
function costFor(S,i){const n=tokCount(S,i);return n>=3?3:[3,4,5][n]}

function draw(S){
  if(!S.deck.length){
    const pool=S.row.splice(0);S.seats.forEach(p=>pool.push(...p.front.splice(0)));
    if(pool.length){S.deck=shuffle(pool);log(S,'덱이 바닥나 버림 줄과 앞에 놓인 아이템을 섞어 새 덱을 만들었다.')}
  }
  return S.deck.pop()||null;
}
function discardCard(S,i,c){ if(isItem(c)) S.seats[i].front.push(c); else S.row.push(c); }

function newLobby(){return {v:1,phase:'lobby',seats:[],log:['테이블이 열렸다. 자리에 앉아 주세요.']}}

function startGame(S){
  const n=N(S);
  S.decks=n>=4?2:1;
  let deck=fullDeck(S.decks);
  S.qPile=deck.filter(c=>R(c)===12); S.kPile=deck.filter(c=>R(c)===13);
  S.deck=shuffle(deck.filter(c=>R(c)<12)); S.row=[]; S.qIn=false; S.kIn=false;
  S.seats.forEach(p=>{p.hand=[];p.tokens=[];p.front=[]});
  S.seats.forEach(p=>{p.hand.push(draw(S),draw(S))});
  S.supply={S:3,H:3,D:3,C:3};
  S.board=null;
  // 첫 선: 모두 주사위, 같은 최고 눈끼리 다시
  let cand=S.seats.map((_,i)=>i);
  while(cand.length>1){const rolls=cand.map(()=>d6());const m=Math.max(...rolls);cand=cand.filter((_,k)=>rolls[k]===m)}
  S.first=cand[0]; S.round=1; S.ot=false; S.goal=3; S.die=null; S.winners=null;
  S.pending=null; S.mg=null; S.reward=null; S.turn=null;
  S.log=[]; log(S,`게임 시작. 주사위로 정한 첫 선: 자리 ${S.first+1}.`);
  startMain(S);
}

function rollBoard(S){S.die=d6();S.phase='clubs';S.deadline=null;S.ready={};log(S,`${S.round}라운드 미니게임 주사위: ${S.die} → ${MG[S.board[S.die-1]].name}`);fx(S,{t:'dice',v:S.die,mg:S.board[S.die-1]})}
function useClub(S,i,c,arg){
  const p=S.seats[i];p.hand.splice(p.hand.indexOf(c),1);p.front.push(c);
  const r=R(c);
  if(r===11){S.die=d6();log(S,`자리 ${i+1}: ♣J로 다시 굴림 → ${S.die}`)}
  else if(r===12){S.die=((S.die-1+arg+6)%6)+1;log(S,`자리 ${i+1}: ♣Q로 눈 ${arg>0?'+1':'-1'} → ${S.die}`)}
  else {S.die=arg;log(S,`자리 ${i+1}: ♣K로 칸 ${arg}을 직접 고름`)}
  log(S,`이번 미니게임: ${MG[S.board[S.die-1]].name}`);S.ready={};
  if(r===11)fx(S,{t:'dice',v:S.die,mg:S.board[S.die-1],seats:[i],club:c});else fx(S,{t:'banner',text:`${cname(c)} → ${S.die}번 ${MG[S.board[S.die-1]].name}`,seats:[i],club:c,v:S.die});
}
function startMain(S){
  S.phase='main'; S.deadline=null;
  S.order=[];for(let k=0;k<N(S);k++)S.order.push((S.first+k)%N(S));
  S.ti=0; resetTurn(S);
}
function resetTurn(S){S.turn={seat:S.order[S.ti],picked:false,mustDiscard:false,item:false,token:false,trim:false,peek:null}}
function cur(S){return S.turn&&S.turn.seat}

function pickup(S,i,fromRow,want){
  const p=S.seats[i];let c;
  if(fromRow){const k=S.row.lastIndexOf(want);if(k<0)return 'none';c=S.row.splice(k,1)[0]} else {c=draw(S);if(!c)return 'none'}
  p.hand.push(c);S.turn.picked=true;S.turn.mustDiscard=true;S.turn.justTook=c;
  log(S,`자리 ${i+1}: ${fromRow?'버림 줄에서 '+cname(c):'덱에서 1장'}을 주웠다.`);
}
function pickupDiscard(S,i,c){
  const p=S.seats[i];p.hand.splice(p.hand.indexOf(c),1);discardCard(S,i,c);S.turn.mustDiscard=false;
  log(S,`자리 ${i+1}: ${cname(c)}을 버렸다.`);
}
function canMakeToken(S,i,cards){
  // cards: 고른 카드들(숫자 카드 + ♦Q/♦K 0~1장)
  const items=cards.filter(isItem), nums=cards.filter(c=>!isItem(c));
  if(items.length>1)return '아이템은 1장만 함께 낼 수 있다.';
  const it=items[0];
  if(it&&!(U(it)==='D'&&(R(it)===12||R(it)===13)))return '토큰 만들기에는 ♦Q·♦K만 함께 낼 수 있다.';
  if(it&&S.turn.item)return '이번 턴에 이미 아이템을 썼다.';
  if(S.turn.token)return '이번 턴에 이미 토큰을 만들었다.';
  if(!nums.length)return '숫자 카드를 고르세요.';
  const suit=U(nums[0]);if(nums.some(c=>U(c)!==suit))return '숫자 카드는 같은 문양이어야 한다.';
  let cost=costFor(S,i);
  const n=tokCount(S,i);
  if(it&&R(it)===13){if(n===0||n>=3)return '♦K는 첫 토큰과 연장전 토큰에는 효과가 없다.';cost=3}
  if(nums.length!==cost)return `숫자 카드 ${cost}장이 필요하다(지금 ${nums.length}장).`;
  if(n>=S.goal)return '이미 목표 개수만큼 토큰이 있다.';
  if(!(it&&R(it)===12)){
    if(S.seats[i].tokens.includes(suit))return '이미 가진 색이다.';
    if(S.supply[suit]<=0)return '그 색 토큰이 공급처에 없다.';
  }
  return null;
}
function makeToken(S,i,cards,color){
  const p=S.seats[i];const it=cards.find(isItem);const nums=cards.filter(c=>!isItem(c));
  let col=U(nums[0]); if(it&&R(it)===12)col=color;
  for(const c of cards){p.hand.splice(p.hand.indexOf(c),1)}
  nums.forEach(c=>S.row.push(c)); if(it){p.front.push(it);S.turn.item=true}
  p.tokens.push(col);S.supply[col]--;S.turn.token=true;
  log(S,`자리 ${i+1}: ${SNAME[col]} 토큰을 만들었다${it?' ('+cname(it)+' 사용)':''}. 토큰 ${p.tokens.length}개.`);fx(S,{t:'token',col,seats:[i],n:p.tokens.length});
}
function startAttack(S,i,c,target,arg){
  const p=S.seats[i];p.hand.splice(p.hand.indexOf(c),1);p.front.push(c);S.turn.item=true;
  S.pending={card:c,attacker:i,target,arg,deadline:Date.now()+DEF_MS};S.phase='defense';
  const what={11:'손패 1장 뺏기',12:`${SNAME[arg]} 숫자 카드 1장 받기`,13:`${SNAME[arg]} 토큰 뺏기`}[R(c)];
  log(S,`자리 ${i+1} → 자리 ${target+1}: ${cname(c)} 공격 (${what}). 방어 기회 ${DEF_MS/1000}초.`);fx(S,{t:'attack',card:c,seats:[i,target]});
}
function applyAttack(S,kind,from,to,arg){
  // from이 to에게서 가져온다
  const A=S.seats[from],T=S.seats[to];
  if(kind===11){ if(!T.hand.length){log(S,`자리 ${to+1}의 손패가 없어 아무것도 못 뺏었다.`);return}
    const c=T.hand.splice(rnd(T.hand.length),1)[0];A.hand.push(c);log(S,`자리 ${from+1}이 자리 ${to+1}의 손패 1장을 뺏었다.`)}
  else if(kind===12){const m=T.hand.filter(c=>U(c)===arg&&!isItem(c));
    if(!m.length){log(S,`자리 ${to+1}: "${SNAME[arg]} 숫자 카드 없다."`);return}
    const c=m[rnd(m.length)];T.hand.splice(T.hand.indexOf(c),1);A.hand.push(c);log(S,`자리 ${to+1}이 ${SNAME[arg]} 숫자 카드 1장을 자리 ${from+1}에게 줬다.`)}
  else {let col=arg;
    if(!col||!T.tokens.includes(col)||A.tokens.includes(col)){const ok=T.tokens.filter(t=>!A.tokens.includes(t));col=ok.length?ok[rnd(ok.length)]:null}
    if(!col){log(S,`가져올 수 있는 토큰이 없어 막기만 한 셈이 됐다.`);return}
    T.tokens.splice(T.tokens.indexOf(col),1);A.tokens.push(col);log(S,`자리 ${from+1}이 자리 ${to+1}의 ${SNAME[col]} 토큰을 뺏었다.`)}
}
function defend(S,i,c){
  const P=S.pending;const p=S.seats[i];p.hand.splice(p.hand.indexOf(c),1);p.front.push(c);
  const kind=R(P.card);
  if(R(c)===11){log(S,`자리 ${i+1}: ♥J로 공격을 막았다.`);fx(S,{t:'banner',text:'막았다!',seats:[i],tone:'good'})}
  else {log(S,`자리 ${i+1}: ♥K로 공격을 되돌렸다(막을 수 없음).`);fx(S,{t:'banner',text:'되돌렸다!',seats:[i],tone:'good'});applyAttack(S,kind,P.target,P.attacker,null)}
  S.pending=null;S.phase='main';
}
function resolveAttack(S){const P=S.pending;applyAttack(S,R(P.card),P.attacker,P.target,P.arg);S.pending=null;S.phase='main'}
function useHQ(S,i,c,picks){const p=S.seats[i];p.hand.splice(p.hand.indexOf(c),1);p.front.push(c);S.turn.item=true;
  for(const x of picks){S.row.splice(S.row.indexOf(x),1);p.hand.push(x)}
  log(S,`자리 ${i+1}: ♥Q로 버림 줄에서 ${picks.map(cname).join(', ')||'0장'} 가져옴.`)}
function useDJ(S,i,c){const p=S.seats[i];p.hand.splice(p.hand.indexOf(c),1);p.front.push(c);S.turn.item=true;
  const pk=[];for(let k=0;k<3;k++){const x=draw(S);if(x)pk.push(x)}S.turn.peek=pk;log(S,`자리 ${i+1}: ♦J로 덱 위 ${pk.length}장을 봤다.`)}
function pickDJ(S,i,c){const p=S.seats[i];const pk=S.turn.peek;p.hand.push(c);pk.splice(pk.indexOf(c),1);
  pk.forEach(x=>discardCard(S,i,x));S.turn.peek=null;log(S,`자리 ${i+1}: 1장을 갖고 ${pk.map(cname).join(', ')}은 버렸다.`)}
function endTurn(S){
  S.ti++; if(S.ti<S.order.length){resetTurn(S);return}
  S.turn=null; afterMain(S);
}
function afterMain(S){
  const mx=Math.max(...S.seats.map((_,i)=>tokCount(S,i)));
  if(mx>=1&&!S.qIn){S.deck.push(...S.qPile);S.qPile=[];shuffle(S.deck);S.qIn=true;log(S,'첫 토큰이 나와 Q 묶음을 덱에 섞었다.')}
  if(mx>=2&&!S.kIn){S.deck.push(...S.kPile);S.kPile=[];shuffle(S.deck);S.kIn=true;log(S,'토큰 2개가 나와 K 묶음을 덱에 섞었다.')}
  const w=S.seats.map((p,i)=>i).filter(i=>new Set(S.seats[i].tokens).size>=S.goal);
  if(w.length===1){S.winners=w;S.phase='ended';log(S,`자리 ${w[0]+1} 우승!`);fx(S,{t:'win',seats:w});return}
  if(w.length>=2){
    if(!S.ot){S.ot=true;S.goal=4;fx(S,{t:'banner',text:'4색 연장전!',seats:w,tone:'bad'});log(S,`3색을 채운 사람이 ${w.length}명. 4색 연장전에 들어간다(4번째 토큰 비용 3장).`)}
    else{let c=w.slice(),detail=[];
      while(c.length>1){const sums=c.map(i=>S.seats[i].tokens.slice(0,4).reduce(a=>a+d6(),0));detail.push(c.map((i,k)=>`자리 ${i+1}=${sums[k]}`).join(', '));const m=Math.max(...sums);c=c.filter((_,k)=>sums[k]===m)}
      S.winners=c;S.phase='ended';log(S,`큐빅 롤: ${detail.join(' / ')} → 자리 ${c[0]+1} 우승!`);fx(S,{t:'win',seats:c});return}
  }
  const n=N(S);const pool=Object.keys(MG).filter(k=>MG[k].min<=n&&n<=MG[k].max);
  const b=[];while(b.length<6)b.push(...shuffle(pool.slice()));S.board=b.slice(0,6);
  const disp=[];for(let k=0;k<2*N(S)+1;k++){const x=draw(S);if(x)disp.push(x)}S.rewardDisp=disp;
  S.phase='roll';S.die=null;log(S,'메인 턴이 모두 끝났다. 미니게임 6장: '+S.board.map(k=>MG[k].name).join(', ')+' / 보상 진열: '+disp.map(cname).join(' '));
}

/* ---- 규칙 설명 시간: 모두 준비하면 시작 (♣는 그동안 언제든) ---- */
function readyUp(S,i){if(S.phase!=='clubs')return false;S.ready=S.ready||{};S.ready[i]=true;
  if(S.seats.every((_,k)=>S.ready[k])){S.deadline=null;reclaim(S);log(S,'모두 준비 완료. 버림 줄과 앞의 아이템을 거둬 덱에 섞었다.');startMinigame(S)}}
/* ---- 미니게임 공통 ---- */
function reclaim(S){S.deck.push(...S.row.splice(0));S.seats.forEach(p=>S.deck.push(...p.front.splice(0)));shuffle(S.deck)}
function buildBundle(S,need){ // 재료 묶음 폐지: 덱에서 필요한 만큼 뽑는다
  const b=[];for(let k=0;k<need;k++){const x=draw(S);if(!x)break;b.push(x)}return b;
}
function startMinigame(S){
  const id=S.board[S.die-1];const n=N(S);
  const ord=[];for(let k=0;k<n;k++)ord.push((S.first+k)%n);
  S.phase='mg';
  if(id==='hold'){S.mg={id,pan:1,ord,ci:0,k:0,s:0,tot:Array(n).fill(0),last:null}}
  if(id==='bomb'){S.mg={id,bundle:[],alive:ord.slice(),ci:0,lay:[],flip:{},arm:{},out:[]};bombLay(S)}
  if(id==='auction'){const bundle=buildBundle(S,5+5*n);const hands={};ord.forEach(i=>hands[i]=bundle.splice(0,5));
    const prizes=bundle.splice(0,5).map((c,k)=>({c,up:k<3}));
    S.mg={id,bundle,hands,prizes,ai:0,pot:[],step:'pre',ready:{},bids:{},won:{},spent:[]};
    ord.forEach(i=>S.mg.won[i]=[]);auctionOpen(S)}
  if(id==='balloon')balloonStart(S,ord);
  if(id==='rps'||id==='vault')ovnStart(S,id);
  if(id==='count')countStart(S,ord);
  if(id==='race')raceStart(S,ord);
  log(S,`미니게임 시작: ${MG[id].name}`);fx(S,{t:'title',mg:id});
}
function rankBy(scores,desc=true){ // scores: {seat:value} → 순위 그룹 [[seat..],..]
  const ks=Object.keys(scores).map(Number);const vals=[...new Set(ks.map(k=>scores[k]))].sort((a,b)=>desc?b-a:a-b);
  return vals.map(v=>ks.filter(k=>scores[k]===v));
}
function endMinigame(S,groups){
  const m=S.mg;
  if(m.bundle){const back=m.bundle.slice();
    if(m.lay)back.push(...m.lay.filter(Boolean));Object.values(m.flip||{}).forEach(f=>back.push(f.c));
    if(m.hands)Object.values(m.hands).forEach(h=>back.push(...h));
    if(m.prizes)m.prizes.forEach(p=>p&&back.push(p.c));
    if(m.won)Object.values(m.won).forEach(w=>back.push(...w));
    if(m.spent)back.push(...m.spent); if(m.pot)back.push(...m.pot.map(p=>p.c||p)); if(m.pile)back.push(...m.pile);
    S.deck.push(...back);shuffle(S.deck)}
  // 동점은 디지털 시험판에서 무작위 순서로 고른다
  const order=[];groups.forEach(g=>order.push(...shuffle(g.slice())));
  S.lastRank=groups;fx(S,{t:'rank',groups});
  log(S,'미니게임 순위: '+groups.map((g,k)=>`${k+1}위 ${g.map(i=>'자리 '+(i+1)).join('·')}`).join(' / '));
  const disp=S.rewardDisp||[];S.rewardDisp=null;
  S.mg=null;S.phase='reward';S.reward={disp,order:order.concat(order),pi:0};
  if(!disp.length)finishReward(S);
}
function rewardPick(S,i,c){const R_=S.reward;R_.disp.splice(R_.disp.indexOf(c),1);S.seats[i].hand.push(c);R_.pi++;
  log(S,`자리 ${i+1}: 보상 ${cname(c)}`);if(R_.pi>=R_.order.length||!R_.disp.length)finishReward(S)}
function finishReward(S){S.reward.disp.forEach(c=>S.row.push(c));S.reward=null;
  S.first=(S.first+1)%N(S);S.round++;S.die=null;S.board=null;log(S,`${S.round}라운드. 선: 자리 ${S.first+1}.`);startMain(S)}

/* ---- 버티기 ---- */
function holdRoll(S,i,item){
  const m=S.mg;const p=S.seats[i];
  if(item){p.hand.splice(p.hand.indexOf(item),1);p.front.push(item)}
  m.k++;const a=d6(),b=item?d6():null;const d=item?Math.max(a,b):a;
  m.last={i,a,b,d,th:m.k};fx(S,{t:'dice',v:d,both:b!=null?[a,b]:null,bust:d<=m.k,th:m.k,seats:[i]});
  if(d<=m.k){log(S,`버티기: 자리 ${i+1} ${item?`[${a},${b}]→`:''}${d} (기준 ${m.k} 이하) 이번 판 ${m.s}점을 잃었다.`);m.s=0;holdNext(S)}
  else{m.s+=d;log(S,`버티기: 자리 ${i+1} ${item?`[${a},${b}]→`:''}${d}. 이번 판 ${m.s}점.`)}
}
function holdStop(S,i){const m=S.mg;m.tot[i]+=m.s;log(S,`버티기: 자리 ${i+1} 멈춤, ${m.s}점 확정 (합계 ${m.tot[i]}).`);holdNext(S)}
function holdNext(S){const m=S.mg;m.k=0;m.s=0;m.ci++;
  if(m.ci>=m.ord.length){m.ci=0;m.pan++;if(m.pan>3){const sc={};m.ord.forEach(i=>sc[i]=m.tot[i]);endMinigame(S,rankBy(sc));return}log(S,`버티기 ${m.pan}판.`)}}

/* ---- 폭탄 버튼 ---- */
function bombLay(S){const m=S.mg;
  // 깐 카드를 덱에 섞고 남은 인원 + 1장을 새로 뽑는다
  S.deck.push(...m.lay.filter(Boolean));Object.values(m.flip).forEach(f=>S.deck.push(f.c));shuffle(S.deck);
  m.lay=buildBundle(S,m.alive.length+1);m.flip={};m.arm={};m.ci=0;
  const st=m.alive.slice().sort((a,b)=>((a-S.first+N(S))%N(S))-((b-S.first+N(S))%N(S)));m.alive=st;}
function bombArm(S,i,item){const p=S.seats[i];p.hand.splice(p.hand.indexOf(item),1);p.front.push(item);S.mg.arm[i]=true;log(S,`폭탄 버튼: 자리 ${i+1} 아이템(-3)`)}
function bombFlip(S,i,k){const m=S.mg;const c=m.lay[k];if(!c)return;m.lay[k]=null;
  const v=R(c)-(m.arm[i]?3:0);m.flip[i]={c,v};log(S,`폭탄 버튼: 자리 ${i+1} → ${cname(c)}${m.arm[i]?` (-3 → ${v})`:''}`);m.ci++;
  if(m.ci>=m.alive.length){const mx=Math.max(...m.alive.map(j=>m.flip[j].v));const out=m.alive.filter(j=>m.flip[j].v===mx);
    m.lay=m.lay.filter(Boolean);
    if(m.alive.length===2){m.hits=m.hits||{};out.forEach(j=>m.hits[j]=(m.hits[j]||0)+1);
      log(S,`폭탄! ${out.map(j=>'자리 '+(j+1)).join('·')} (결승 폭탄 ${m.alive.map(j=>'자리 '+(j+1)+' '+(m.hits[j]||0)+'개').join(', ')})`);
      const dead=m.alive.filter(j=>(m.hits[j]||0)>=2);fx(S,{t:'pop',seats:out,bomb:true,small:!dead.length});if(!dead.length){bombLay(S);return}
      m.out.push(dead);m.alive=m.alive.filter(j=>!dead.includes(j));log(S,`탈락: ${dead.map(j=>'자리 '+(j+1)).join('·')}`)}
    else{m.out.push(out);m.alive=m.alive.filter(j=>!out.includes(j));log(S,`폭탄! 탈락: ${out.map(j=>'자리 '+(j+1)).join('·')}`);fx(S,{t:'pop',seats:out,bomb:true})}
    if(m.alive.length<=1){const groups=[];if(m.alive.length)groups.push(m.alive.slice());for(let k=m.out.length-1;k>=0;k--)groups.push(m.out[k]);
      endMinigame(S,groups);return}
    bombLay(S)}}

/* ---- 눈치 경매 ---- */
function auctionOpen(S){const m=S.mg;
  while(m.ai<m.prizes.length&&!m.prizes[m.ai])m.ai++;
  if(m.ai>=m.prizes.length){auctionEnd(S);return}
  const p=m.prizes[m.ai];p.up=true;m.pot.push(p);m.prizes[m.ai]=null;m.ai++;
  m.step='pre';m.ready={};m.bids={};}
function auctionItem(S,i,item){const m=S.mg;const p=S.seats[i];
  while(m.ai<m.prizes.length&&!m.prizes[m.ai])m.ai++;
  if(m.ai>=m.prizes.length)return 'no';
  p.hand.splice(p.hand.indexOf(item),1);p.front.push(item);
  const x=m.prizes[m.ai];x.up=true;m.pot.push(x);m.prizes[m.ai]=null;m.ai++;
  log(S,`눈치 경매: 자리 ${i+1} 아이템 → 다음 상품 ${cname(x.c)}도 이번 경매에 걸림.`)}
function auctionReady(S,i){const m=S.mg;m.ready[i]=true;if(Object.keys(m.ready).length>=N(S)){m.step='bid'}}
function auctionBid(S,i,c){const m=S.mg;m.hands[i].splice(m.hands[i].indexOf(c),1);m.bids[i]=c;
  if(Object.keys(m.bids).length>=N(S)){
    const b=m.bids;const vals=Object.keys(b).map(Number);const cnt={};vals.forEach(j=>{cnt[R(b[j])]=(cnt[R(b[j])]||0)+1});
    const uniq=vals.filter(j=>cnt[R(b[j])]===1);
    const shown=vals.map(j=>`자리 ${j+1}:${cname(b[j])}`).join(', ');
    vals.forEach(j=>m.spent.push(b[j]));
    if(uniq.length){const w=uniq.reduce((a,j)=>R(b[j])>R(b[a])?j:a,uniq[0]);
      m.won[w].push(...m.pot.map(p=>p.c));log(S,`눈치 경매: ${shown} → 자리 ${w+1}이 ${m.pot.map(p=>cname(p.c)).join('+')} 획득.`);fx(S,{t:'bids',bids:{...b},win:w,pot:m.pot.map(p=>p.c)});m.pot=[]}
    else{log(S,`눈치 경매: ${shown} → 모두 지워져 상품이 다음 경매에 얹힌다.`);fx(S,{t:'bids',bids:{...b},win:null})}
    m.lastBids=b;m.bids={};
    if(Object.values(m.hands).every(h=>!h.length)){auctionEnd(S);return}
    auctionOpen(S)}}
function auctionEnd(S){const m=S.mg;const sc={};Object.keys(m.won).forEach(k=>sc[k]=m.won[k].reduce((a,c)=>a+R(c),0));
  log(S,'눈치 경매 점수: '+Object.keys(sc).map(k=>`자리 ${+k+1}=${sc[k]}`).join(', '));endMinigame(S,rankBy(sc))}

/* ---- 연출 이벤트 (화면이 받아서 효과로 보여 준다) ---- */
function fx(S,o){S.fxn=(S.fxn||0)+1;o.id=S.fxn;(S.fx=S.fx||[]).push(o);if(S.fx.length>12)S.fx.shift()}
function useItem(S,i,item){const p=S.seats[i];if(!item||!isItem(item)||!p.hand.includes(item))return false;p.hand.splice(p.hand.indexOf(item),1);p.front.push(item);return true}
function hasItem(S,i){return S.seats[i].hand.some(isItem)}
function outGroups(m,first){const g=first&&first.length?[first.slice()]:[];for(let k=m.out.length-1;k>=0;k--)g.push(m.out[k]);return g}

/* ---- 풍선 불기 ---- */
const BLIMIT=50;
function balloonStart(S,ord){const hands={};ord.forEach(i=>hands[i]=buildBundle(S,3));
  S.mg={id:'balloon',bundle:[],hands,pile:[],total:0,alive:ord.slice(),ci:0,out:[],last:null,pops:0}}
function balloonPlay(S,i,c,item){const m=S.mg;if(m.alive[m.ci]!==i||!m.hands[i].includes(c))return false;
  if(item&&!useItem(S,i,item))return false;
  m.hands[i].splice(m.hands[i].indexOf(c),1);m.pile.push(c);const v=R(c);
  m.total=item?Math.max(0,m.total-v):m.total+v;m.last={i,c,sub:!!item,total:m.total};
  const x=draw(S);if(x)m.hands[i].push(x);
  log(S,`풍선 불기: 자리 ${i+1} ${cname(c)}${item?' (빼기)':''} → 합 ${m.total}`);
  if(m.total>BLIMIT){
    fx(S,{t:'pop',seats:[i],total:m.total});log(S,`펑! 자리 ${i+1} 탈락 (합 ${m.total}).`);
    const idx=m.alive.indexOf(i);m.out.push([i]);m.alive.splice(idx,1);
    S.deck.push(...m.pile,...m.hands[i]);m.pile=[];m.hands[i]=[];shuffle(S.deck);m.total=0;m.pops++;m.last=null;
    if(m.alive.length<=1){endMinigame(S,outGroups(m,m.alive));return}
    m.ci=idx%m.alive.length;return}
  m.ci=(m.ci+1)%m.alive.length}

/* ---- 1 대 나머지 공통 (선 가위바위보·금고 털기) ---- */
function ovnStart(S,id){const n=N(S),lead=S.first,others=[];for(let k=1;k<n;k++)others.push((lead+k)%n);
  S.mg={id,bundle:[],lead,alive:others,round:1,max:others.length+1,out:[],picks:{},armL:false,saveq:[],losers:[],saved:[],last:null,step:id==='rps'?'pick':'hide'}}
function ovnLosers(S,losers){const m=S.mg;m.losers=losers;m.saved=[];m.saveq=losers.filter(j=>hasItem(S,j));
  if(m.saveq.length){m.step='save';return}ovnApply(S)}
function ovnSave(S,i,item){const m=S.mg;if(m.step!=='save'||!m.saveq.includes(i))return false;
  if(item){if(!useItem(S,i,item))return false;m.saved.push(i);log(S,`자리 ${i+1}: 아이템으로 버텼다.`);fx(S,{t:'banner',text:'버텼다!',seats:[i],tone:'good'})}
  m.saveq=m.saveq.filter(j=>j!==i);if(!m.saveq.length)ovnApply(S)}
function ovnApply(S){const m=S.mg;const dead=m.losers.filter(j=>!m.saved.includes(j));
  if(dead.length){m.out.push(dead);m.alive=m.alive.filter(j=>!dead.includes(j));log(S,`탈락: ${dead.map(j=>'자리 '+(j+1)).join('·')}`)}
  m.losers=[];m.saved=[];m.saveq=[];
  if(!m.alive.length){log(S,`자리 ${m.lead+1}(${m.id==='rps'?'선':'경비원'})이 모두 탈락시켰다!`);fx(S,{t:'banner',text:m.id==='rps'?'선 승리!':'경비원 승리!',seats:[m.lead],tone:'win'});
    endMinigame(S,[[m.lead],...outGroups(m)]);return}
  m.round++;
  if(m.round>m.max){log(S,`살아남은 사람: ${m.alive.map(j=>'자리 '+(j+1)).join('·')}`);fx(S,{t:'banner',text:'살아남았다!',seats:m.alive.slice(),tone:'win'});
    endMinigame(S,[...outGroups(m,m.alive),[m.lead]]);return}
  m.picks={};m.armL=false;m.zones=null;m.step=m.id==='rps'?'pick':'hide'}

/* ---- 선 가위바위보 ---- */
const RPSN={R:'바위',P:'보',S:'가위'},BEATS={R:'S',P:'R',S:'P'};
function rpsPick(S,i,h){const m=S.mg;if(m.step!=='pick'||m.picks[i]||!(i===m.lead||m.alive.includes(i))||!RPSN[h])return false;
  m.picks[i]=h;const need=[m.lead,...m.alive];
  if(need.every(j=>m.picks[j])){const L=m.picks[m.lead];
    const losers=m.alive.filter(j=>BEATS[L]===m.picks[j]||(m.armL&&m.picks[j]===L));
    m.last={picks:{...m.picks},armL:m.armL,round:m.round,losers};
    log(S,`선 가위바위보 ${m.round}판: ${need.map(j=>`자리 ${j+1} ${RPSN[m.picks[j]]}`).join(', ')}`);
    fx(S,{t:'rps',picks:{...m.picks},lead:m.lead,losers,armL:m.armL});
    ovnLosers(S,losers)}}
function rpsArm(S,i,item){const m=S.mg;if(m.step!=='pick'||i!==m.lead||m.picks[m.lead]||m.armL)return false;if(!useItem(S,i,item))return false;
  m.armL=true;log(S,`자리 ${i+1}(선): 아이템 → 이번엔 비긴 사람도 탈락.`);fx(S,{t:'banner',text:'비겨도 탈락!',seats:[i],tone:'bad'})}

/* ---- 금고 털기 ---- */
function vaultHide(S,i,z){const m=S.mg;if(m.step!=='hide'||!m.alive.includes(i)||m.picks[i]||![1,2,3].includes(z))return false;
  m.picks[i]=z;if(m.alive.every(j=>m.picks[j]))m.step='guard'}
function vaultArm(S,i,item){const m=S.mg;if(i!==m.lead||m.armL||!(m.step==='hide'||m.step==='guard'))return false;if(!useItem(S,i,item))return false;
  m.armL=true;log(S,`자리 ${i+1}(경비원): 아이템 → 이번엔 구역 2곳을 뒤진다.`);fx(S,{t:'banner',text:'2곳 수색!',seats:[i],tone:'bad'})}
function vaultGuard(S,i,zones){const m=S.mg;if(m.step!=='guard'||i!==m.lead)return false;
  zones=[...new Set(zones)].filter(z=>[1,2,3].includes(z));if(zones.length!==(m.armL?2:1))return false;
  m.zones=zones;const losers=m.alive.filter(j=>zones.includes(m.picks[j]));
  m.last={picks:{...m.picks},zones,round:m.round,losers};
  log(S,`금고 털기 ${m.round}판: 경비원이 ${zones.join('·')}번을 뒤짐. 숨은 곳 ${m.alive.map(j=>`자리 ${j+1}→${m.picks[j]}`).join(', ')}`);
  fx(S,{t:'vault',picks:{...m.picks},zones,lead:m.lead,losers});
  ovnLosers(S,losers)}

/* ---- 몇 장이었지 ---- */
const CFLIP=1000,CLEAD=4500;
function countStart(S,ord){const hits={};ord.forEach(i=>hits[i]=0);S.mg={id:'count',bundle:[],pan:1,hits,seq:null,dec:null,ans:{},arm:{},last:null,step:'flip'};countPan(S)}
function countPan(S){const m=S.mg;if(m.seq){S.deck.push(...m.seq);if(m.dec)S.deck.push(m.dec);shuffle(S.deck)}
  m.seq=buildBundle(S,12);m.dec=draw(S);m.t0=Date.now()+CLEAD;m.ans={};m.arm={};m.step='flip'}
function countOpenAt(m){return m.t0+m.seq.length*CFLIP}
function countArm(S,i,item){const m=S.mg;if(m.arm[i]||(i in m.ans))return false;if(!useItem(S,i,item))return false;m.arm[i]=true;log(S,`몇 장이었지: 자리 ${i+1} 아이템(±1)`)}
function countAnswer(S,i,a){const m=S.mg;if((i in m.ans)||!(i in m.hits)||Date.now()<countOpenAt(m)||!(a>=0&&a<=6))return false;
  m.ans[i]=a;
  if(Object.keys(m.hits).every(k=>k in m.ans)){
    const suit=m.dec?U(m.dec):'S';const cnt=m.seq.filter(c=>U(c)===suit).length;const tgt=Math.min(cnt,6);
    const hit=Object.keys(m.ans).map(Number).filter(k=>m.ans[k]===tgt||(m.arm[k]&&Math.abs(m.ans[k]-tgt)<=1));
    hit.forEach(k=>m.hits[k]++);
    m.last={pan:m.pan,suit,cnt,ans:{...m.ans},arm:{...m.arm},hit};
    log(S,`몇 장이었지 ${m.pan}판: ${SYM[suit]} ${cnt}장. 맞힘 ${hit.map(k=>'자리 '+(k+1)).join('·')||'없음'}`);
    fx(S,{t:'count',suit,cnt,ans:{...m.ans},hit});
    m.pan++;
    if(m.pan>3){S.deck.push(...m.seq);if(m.dec)S.deck.push(m.dec);shuffle(S.deck);m.seq=null;m.dec=null;endMinigame(S,rankBy(m.hits));return}
    countPan(S)}}

/* ---- 문양 경주 ---- */
const RGOAL=4,RLIMIT=15;
function raceStart(S,ord){S.mg={id:'race',bundle:[],order:ord.slice(),pi:0,bet:{},pos:{S:0,H:0,D:0,C:0},pile:[],step:'bet',last:null}}
function raceBet(S,i,s){const m=S.mg;if(m.step!=='bet'||m.order[m.pi]!==i||!SYM[s])return false;m.bet[i]=s;m.pi++;log(S,`문양 경주: 자리 ${i+1} → ${SYM[s]}`);if(m.pi>=m.order.length)m.step='race'}
function raceSwap(S,i,item,s){const m=S.mg;if(m.step!=='race'||!(i in m.bet)||m.bet[i]===s||!SYM[s])return false;if(!useItem(S,i,item))return false;
  m.bet[i]=s;log(S,`문양 경주: 자리 ${i+1} 아이템 → ${SYM[s]}로 바꿈`);fx(S,{t:'banner',text:`${SYM[s]}로 갈아탔다!`,seats:[i]})}
function raceEnd(S,win){const m=S.mg;const first=m.order.filter(j=>m.bet[j]===win);const sc={};m.order.filter(j=>m.bet[j]!==win).forEach(j=>sc[j]=m.pos[m.bet[j]]);
  endMinigame(S,(first.length?[first]:[]).concat(rankBy(sc)))}
function raceLimit(S){const m=S.mg;const mx=Math.max(...SUITS.map(s=>m.pos[s]));const lead=SUITS.filter(s=>m.pos[s]===mx);
  log(S,`${m.pile.length}장을 다 뒤집었다. 가장 앞선 문양: ${lead.map(s=>SYM[s]).join('·')}`);fx(S,{t:'banner',text:`${lead.map(s=>SYM[s]).join('·')} 우승!`,tone:'win'});
  const first=m.order.filter(j=>lead.includes(m.bet[j]));const sc={};m.order.filter(j=>!lead.includes(m.bet[j])).forEach(j=>sc[j]=m.pos[m.bet[j]]);
  endMinigame(S,(first.length?[first]:[]).concat(rankBy(sc)))}
function raceFlip(S,i){const m=S.mg;if(m.step!=='race'||i!==S.first)return false;const c=draw(S);
  if(!c){raceLimit(S);return}
  m.pile.push(c);const s=U(c),fw=R(c)<=10;m.pos[s]=fw?m.pos[s]+1:Math.max(0,m.pos[s]-1);m.last={c,s,fw};
  log(S,`문양 경주: ${cname(c)} → ${SYM[s]} ${fw?'앞으로':'뒤로'} (${m.pos[s]}칸)`);
  if(m.pos[s]>=RGOAL){log(S,`${SYM[s]} 판 밖으로! 우승!`);fx(S,{t:'banner',text:`${SYM[s]} 우승!`,suit:s,tone:'win'});raceEnd(S,s);return}
  if(m.pile.length>=RLIMIT)raceLimit(S)}

/* 시간 지난 단계 넘기기 (아무 기기나, 잠금 안에서) */
function advanceTimers(S){
  const now=Date.now();
  if(S.phase==='clubs'&&S.deadline&&now>=S.deadline){S.deadline=null;reclaim(S);log(S,'버림 줄과 앞의 아이템을 거둬 덱에 섞었다.');
    startMinigame(S);return true}
  if(S.phase==='defense'&&S.pending&&now>=S.pending.deadline){resolveAttack(S);return true}
  return false;
}
/* ================= 공유 상태 연결 (artifact db) ================= */
let db=null,user=null,me=null,REF=null,S=null,names={};
let ctl=null;                 // 지금 조작하는 자리

const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

const SEATCOL=['#2f5fc8','#d3302f','#e0b100','#2e9450','#8a5cc8'];
const SUITCOL={S:'#2f5fc8',H:'#d3302f',D:'#e0b100',C:'#2e9450'};

function seatName(i){const p=S&&S.seats[i];if(!p)return '';const nm=(names[p.uid]&&names[p.uid].name)||'';
  const dup=S.seats.filter(q=>q.uid===p.uid).length>1;return `${nm||'플레이어'}${dup||!nm?` ${i+1}`:''}`}
const mine=i=>!!(S&&S.seats[i]&&S.seats[i].uid===me);

async function act(fn){
  if(busy)return;busy=true;
  try{
    let ok=false;
    for(let t=0;t<15&&!ok;t++){const r=await REF.acquire({holder:me+':'+TAB,ttlMs:1500});
      if(r.acquired)ok=true;else await new Promise(z=>setTimeout(z,150+Math.random()*200))}
    if(!ok){flash('다른 사람이 처리 중이에요. 잠시 뒤 다시 눌러 주세요.');return}
    const snap=await REF.get();const st=snap.exists?clone(snap.data()):newLobby();
    const res=fn(st);if(res===false)return;
    st.v=(st.v||0)+1;await REF.set(st);
  }catch(e){console.error(e);flash(e&&e.code==='invalid_argument'?'이 테이블을 바꿀 권한이 없어요. 공유 메뉴에서 편집자로 초대받아야 해요.':'저장하지 못했어요. 다시 시도해 주세요.')}
  finally{busy=false}
}
let flashMsg='';function flash(m){flashMsg=m;UI.render();setTimeout(()=>{if(flashMsg===m){flashMsg='';UI.render()}},4000)}

function whoActs(){
  if(!S||!S.phase)return null;
  if(S.phase==='roll')return S.first;
  if(S.phase==='clubs'){const need=S.seats.map((_,k)=>k).filter(k=>!(S.ready||{})[k]);return need.find(mine)??need[0]??null}
  if(S.phase==='main')return S.turn&&S.turn.seat;
  if(S.phase==='defense')return S.pending.target;
  if(S.phase==='reward')return S.reward.order[S.reward.pi];
  if(S.phase==='mg'){const m=S.mg;const pickOne=need=>need.find(mine)??need[0]??null;
    if(m.id==='hold')return m.ord[m.ci];
    if(m.id==='bomb')return m.alive[m.ci];
    if(m.id==='auction')return pickOne(S.seats.map((_,i)=>i).filter(i=>m.step==='pre'?!m.ready[i]:!(i in m.bids)));
    if(m.id==='balloon')return m.alive[m.ci];
    if(m.id==='rps'||m.id==='vault'){if(m.step==='save')return pickOne(m.saveq);if(m.step==='guard')return m.lead;
      return pickOne((m.id==='rps'?[m.lead,...m.alive]:m.alive).filter(j=>!m.picks[j]))}
    if(m.id==='count'){if(Date.now()<countOpenAt(m))return null;return pickOne(Object.keys(m.hits).map(Number).filter(k=>!(k in m.ans)))}
    if(m.id==='race')return m.step==='bet'?m.order[m.pi]:S.first}
  return null;
}
function autoCtl(){
  const ms=mySeats();if(!ms.length){ctl=null;return}
  const a=whoActs();
  if(a!=null&&mine(a))ctl=a;else if(ctl==null||!mine(ctl))ctl=ms[0];
}

/* ================= P2P 방 (GitHub Pages판) =================
   방을 만든 사람(방장)의 브라우저가 테이블 상태를 들고 있고, 다른 사람은 방장에게 직접 연결한다.
   기존 공유 저장소와 같은 모양(acquire/get/set/onSnapshot)을 흉내 내서, 게임 코드는 그대로 쓴다.
   연결 중개: PeerJS 공개 서버. 같은 브라우저 시험용으로 ?local=1 이면 BroadcastChannel을 쓴다. */
const P2P=(()=>{
const PREFIX='cubicparty-v1-';
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const rid=n=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<n;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
function myId(){let u=LS.get('cp-uid');if(!u){u='p_'+rid(12);LS.set('cp-uid',u)}return u}
function myName(){return LS.get('cp-name')||''}

/* ---------- 연결 계층 ---------- */
// host: start(code, {onJoin(cid), onMsg(cid,msg), onLeave(cid)}) → {send(cid,msg), broadcast(msg)}
// client: join(code, {onMsg(msg), onClose()}) → {send(msg)}
const LocalNet={
  host(code,h){const ch=new BroadcastChannel('cp-'+code);const peers=new Set();
    ch.onmessage=e=>{const m=e.data;if(m.to!=='host')return;if(m.hello){peers.add(m.from);h.onJoin(m.from);return}h.onMsg(m.from,m.msg)};
    return Promise.resolve({send:(cid,msg)=>ch.postMessage({to:cid,msg}),broadcast:msg=>peers.forEach(cid=>ch.postMessage({to:cid,msg}))})},
  join(code,h){const ch=new BroadcastChannel('cp-'+code);const me='c_'+rid(8);
    ch.onmessage=e=>{const m=e.data;if(m.to===me)h.onMsg(m.msg)};ch.postMessage({to:'host',from:me,hello:1});
    return Promise.resolve({send:msg=>ch.postMessage({to:'host',from:me,msg})})}};
const PeerNet={
  host(code,h){return new Promise((res,rej)=>{const peer=new Peer(PREFIX+code);const conns=new Map();
    peer.on('open',()=>res({send:(cid,msg)=>{const c=conns.get(cid);if(c&&c.open)c.send(msg)},broadcast:msg=>conns.forEach(c=>{if(c.open)c.send(msg)})}));
    peer.on('error',e=>rej(e));
    peer.on('connection',c=>{c.on('open',()=>{conns.set(c.peer,c);h.onJoin(c.peer)});c.on('data',m=>h.onMsg(c.peer,m));c.on('close',()=>{conns.delete(c.peer);h.onLeave&&h.onLeave(c.peer)})});
    peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}})})},
  join(code,h){return new Promise((res,rej)=>{const peer=new Peer();let done=false;
    peer.on('error',e=>{if(!done)rej(e);else h.onClose&&h.onClose(e)});
    peer.on('open',()=>{const c=peer.connect(PREFIX+code,{reliable:true});
      const to=setTimeout(()=>{if(!done)rej({type:'timeout'})},12000);
      c.on('open',()=>{done=true;clearTimeout(to);res({send:m=>{if(c.open)c.send(m)}})});c.on('data',m=>h.onMsg(m));c.on('close',()=>h.onClose&&h.onClose())})})}};

/* ---------- 방장: 테이블 상태와 잠금 ---------- */
function makeHost(code,net,H){let state=null,lock=null;const subs=[];
  const saved=LS.get('cp-host-'+code);if(saved){try{state=JSON.parse(saved)}catch(e){}}
  const snap=()=>({exists:!!state,data:()=>JSON.parse(JSON.stringify(state))});
  const free=holder=>!lock||lock.until<Date.now()||lock.holder===holder;
  const handle=(m,reply)=>{
    if(m.t==='acq'){const ok=free(m.holder);if(ok)lock={holder:m.holder,until:Date.now()+(m.ttl||1500)};reply({t:'r',id:m.id,ok})}
    else if(m.t==='get')reply({t:'r',id:m.id,data:state});
    else if(m.t==='set'){if(lock&&lock.holder!==m.holder&&lock.until>Date.now()){reply({t:'r',id:m.id,err:'locked'});return}
      state=m.data;lock=null;LS.set('cp-host-'+code,JSON.stringify(state));reply({t:'r',id:m.id,ok:true});push()}
    else if(m.t==='time')reply({t:'r',id:m.id,now:Date.now()})};
  const push=()=>{subs.forEach(f=>setTimeout(()=>f(snap()),0));net.broadcast({t:'snap',data:state})};
  H.onJoin=cid=>net.send(cid,{t:'snap',data:state});
  H.onMsg=(cid,m)=>handle(m,r=>net.send(cid,r));
  return {acquire:async o=>({acquired:free(o.holder)&&(lock={holder:o.holder,until:Date.now()+(o.ttlMs||1500)},true)}),
    get:async()=>snap(),set:async d=>{state=JSON.parse(JSON.stringify(d));lock=null;LS.set('cp-host-'+code,JSON.stringify(state));push()},
    onSnapshot:(f)=>{subs.push(f);setTimeout(()=>f(snap()),0)}}}

/* ---------- 참가자: 방장에게 물어본다 ---------- */
function makeClient(conn){let seq=0;const wait=new Map();const subs=[];let last=null,got=false;
  const ask=m=>new Promise((res,rej)=>{const id=++seq;m.id=id;wait.set(id,{res,rej});conn.send(m);setTimeout(()=>{if(wait.has(id)){wait.delete(id);rej({code:'timeout'})}},6000)});
  const onMsg=m=>{if(m.t==='snap'){last=m.data;got=true;subs.forEach(f=>f({exists:!!m.data,data:()=>JSON.parse(JSON.stringify(m.data))}))}
    else if(m.t==='r'&&wait.has(m.id)){const w=wait.get(m.id);wait.delete(m.id);w.res(m)}};
  return {onMsg,ref:{acquire:async o=>{const r=await ask({t:'acq',holder:o.holder,ttl:o.ttlMs});return {acquired:!!r.ok}},
    get:async()=>{const r=await ask({t:'get'});return {exists:!!r.data,data:()=>JSON.parse(JSON.stringify(r.data))}},
    set:async d=>{const r=await ask({t:'set',data:d,holder:me+':'+TAB});if(r.err)throw {code:'locked'}},
    onSnapshot:f=>{subs.push(f);if(got)setTimeout(()=>f({exists:!!last,data:()=>JSON.parse(JSON.stringify(last))}),0)}},
    timeSync:async()=>{const t0=Date.now();const r=await ask({t:'time'});const t1=Date.now();return r.now+(t1-t0)/2-t1}}}

function screen(html){let el=document.getElementById('p2pstart');if(!el){el=document.createElement('div');el.id='p2pstart';el.className='p2pstart';document.body.appendChild(el)}el.innerHTML=html;return el}
function closeScreen(){const el=document.getElementById('p2pstart');if(el)el.remove()}
function startUI(msg0){return new Promise(resolve=>{
  const q=new URLSearchParams(location.search);const code=(q.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const draw=(msg)=>{const el=screen(`<div class="panel lobby"><h1>큐빅 파티</h1>
    <p>방을 만들면 링크가 생겨요. 친구에게 링크를 보내면 같은 테이블에 앉을 수 있어요.</p>

    <div class="btnrow" style="margin-top:12px">${code?`<button class="btn primary" data-p="join">${esc(code)} 방 들어가기</button><button class="btn" data-p="new">새 방 만들기</button>`:`<button class="btn primary" data-p="new">방 만들기</button>`}</div>
    ${code?'':`<div class="btnrow" style="margin-top:10px"><input id="p2pcode" maxlength="6" placeholder="방 코드" style="width:120px;text-transform:uppercase"><button class="btn" data-p="joincode">들어가기</button></div>`}
    <p style="margin-top:14px;font-size:12px">방을 만든 사람의 브라우저가 테이블을 들고 있어요. 방장이 창을 닫으면 게임이 멈추고, 다시 열면 이어서 할 수 있어요.</p></div>`);
    el.onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const nm=(document.getElementById('p2pname').value||'').trim();
      if(!nm){draw('이름을 적어 주세요');return}LS.set('cp-name',nm);

/* ---------- 연결해서 REF·me·이름 돌려주기 ---------- */
async function connect(){const useLocal=new URLSearchParams(location.search).get('local')==='1';const NET=useLocal?LocalNet:PeerNet;
  if(!useLocal&&typeof Peer==='undefined')throw new Error('연결 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
  let msg='';for(;;){const pick=await startUI(msg);msg='';screen(`<div class="panel lobby"><h1>큐빅 파티</h1><p>${pick.host?'방을 여는 중…':'방에 연결하는 중…'}</p></div>`);
    try{let REF_,role;
      if(pick.host){const H={};const net=await NET.host(pick.code,{onJoin:c=>H.onJoin&&H.onJoin(c),onMsg:(c,m)=>H.onMsg&&H.onMsg(c,m),onLeave:()=>{}});
        REF_=makeHost(pick.code,net,H);role='host';LS.set('cp-hosting',pick.code)}
      else{let cl;const conn=await NET.join(pick.code,{onMsg:m=>cl&&cl.onMsg(m),onClose:()=>UI.fatal('방장과 연결이 끊겼어요. 방장이 창을 닫았을 수 있어요. 새로고침해서 다시 들어와 주세요.')});
        cl=makeClient(conn);REF_=cl.ref;role='client';try{const off=await cl.timeSync();if(Math.abs(off)>50){const _now=Date.now.bind(Date);Date.now=()=>_now()+off}}catch(e){}}
      const u=new URL(location.href);u.searchParams.set('room',pick.code);history.replaceState(null,'',u);
      closeScreen();return {REF:REF_,me:myId(),role,code:pick.code,name:myName()}}
    catch(e){console.error(e);const t=e&&e.type;
      const m_=t==='unavailable-id'?'그 방 코드는 이미 쓰이고 있어요. 새 방을 만들어 주세요.':t==='peer-unavailable'||t==='timeout'?'방을 찾지 못했어요. 코드를 확인하거나, 방장이 창을 열어 두었는지 확인해 주세요.':t==='network'||t==='server-error'||t==='socket-error'?'연결 서버에 닿지 못했어요. 인터넷 연결을 확인해 주세요.':'연결하지 못했어요. 다시 시도해 주세요.';
      if(pick.host)LS.set('cp-hosting','');msg=m_}}}
return {connect,myName};
})();

/* ---------------- 풀: 키로 관리하고 목표로 미끄러진다 ---------------- */
const pool=new Map();
function want(key,make,pos,euler,scale=1,opt={}){let e=pool.get(key);
  if(!e){const obj=make();obj.position.copy(opt.from||pos);if(opt.fromEuler)obj.rotation.set(...opt.fromEuler);else obj.rotation.set(...euler);obj.scale.setScalar(opt.fromScale!=null?opt.fromScale:scale);
    scene.add(obj);e={obj,tp:new T.Vector3(),tq:new T.Quaternion(),ts:1,speed:8};pool.set(key,e)}
  e.tp.copy(pos);e.tq.setFromEuler(new T.Euler(...euler));e.ts=scale;e.alive=true;e.speed=opt.speed||8;e.lift=opt.lift||0;e.obj.visible=true;
  if(opt.pick)setPick(e.obj,opt.pick);else clearPick(e.obj);
  return e}
function sweep(){for(const [k,e] of pool){if(!e.alive&&!e.dying){e.dying=true;e.ts=0.001}e.alive=false}}
const picks=new Set();
function setPick(o,data){o.userData.pick=data;picks.add(o)}
function clearPick(o){if(o.userData.pick){delete o.userData.pick;picks.delete(o)}}
function stepPool(dt){for(const [k,e] of pool){const a=window.__fast?1:1-Math.exp(-dt*e.speed);
  const tp=e.tp.clone();if(!window.__fast&&e.lift&&e.obj.position.distanceTo(e.tp)>1.2)tp.y+=e.lift*Math.min(1,e.obj.position.distanceTo(e.tp)/20);
  e.obj.position.lerp(tp,a);e.obj.quaternion.slerp(e.tq,a);const s=e.obj.scale.x+(e.ts-e.obj.scale.x)*a;e.obj.scale.setScalar(s);
  if(e.dying&&s<0.02){scene.remove(e.obj);clearPick(e.obj);pool.delete(k)}}}

const avatars=new Map();let seatKey='';

function buildSeats(){const key=S.seats.length+':'+viewSeat()+':'+S.seats.map(p=>p.uid).join(',');if(key===seatKey)return;seatKey=key;
  for(const [,a] of avatars)scene.remove(a);avatars.clear();
  S.seats.forEach((p,i)=>{if(i===viewSeat())return;const a=buildAvatar(SEATCOL[i%5],HAIRS[i%5]);const sp=seatPos(i);a.position.set(sp.x,0,sp.z);a.lookAt(0,0,0);
    a.traverse(o=>{if(o.isMesh)setPick(o,{kind:'seat',i})});a.userData.at='main';scene.add(a);avatars.set(i,a)})}

/* ================= 넓은 홀: 방 꾸미기 ================= */
const HALL=900;   // 벽까지 거리
function plankTex(){return ctex('plank',512,512,(g,w,h)=>{g.fillStyle='#3a2a1c';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=32){const off=(y/32%2)*130;for(let x=-off;x<w;x+=260){const l=40+((x*7+y*3)%25);g.fillStyle=`rgb(${l+18},${l},${Math.round(l*.62)})`;g.fillRect(x+2,y+2,256,28)}}
  g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;for(let y=0;y<h;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}})}
function wallTex(){return ctex('wall',256,512,(g,w,h)=>{g.fillStyle='#2b201a';g.fillRect(0,0,w,h);for(let x=0;x<w;x+=32){g.fillStyle=(x/32)%2?'#2f231c':'#281d17';g.fillRect(x,0,32,h*.62)}
  g.fillStyle='#4a3020';g.fillRect(0,h*.62,w,h*.38);g.fillStyle='#5b3b23';g.fillRect(0,h*.62,w,10);for(let x=8;x<w;x+=64){g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=3;g.strokeRect(x,h*.68,48,h*.26)}})}
function buildHall(){
  scene.fog=new T.Fog(new T.Color('#14110e').convertSRGBToLinear(),700,2100);
  const ft=plankTex();ft.wrapS=ft.wrapT=T.RepeatWrapping;ft.repeat.set(9,9);
  const floor=new T.Mesh(new T.PlaneGeometry(HALL*2,HALL*2),new T.MeshStandardMaterial({map:ft,roughness:.75}));floor.rotation.x=-Math.PI/2;floor.position.y=.05;floor.receiveShadow=true;scene.add(floor);
  const wt=wallTex();wt.wrapS=T.RepeatWrapping;wt.repeat.set(10,1);const wm=new T.MeshStandardMaterial({map:wt,roughness:.9});
  for(let k=0;k<4;k++){const w=new T.Mesh(new T.PlaneGeometry(HALL*2,420),wm);const a=k*Math.PI/2;w.position.set(Math.sin(a)*HALL,210,Math.cos(a)*HALL);w.rotation.y=a+Math.PI;scene.add(w)}
  const ceil=new T.Mesh(new T.PlaneGeometry(HALL*2,HALL*2),mat('#1a1410',{roughness:1}));ceil.rotation.x=Math.PI/2;ceil.position.y=420;scene.add(ceil);
  for(let k=-2;k<=2;k++){const b=new T.Mesh(new T.BoxGeometry(HALL*2,22,26),mat('#3a2716'));b.position.set(0,408,k*360);scene.add(b)}
  // 창문(달빛)과 커튼
  const win=new T.MeshBasicMaterial({map:ctex('win',128,192,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#1d3a5c');gr.addColorStop(1,'#0e1a2a');g.fillStyle=gr;g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.5)';for(let s=0;s<14;s++)g.fillRect((s*53)%w,(s*37)%(h*.6),2,2);g.fillStyle='#3a2716';g.fillRect(w/2-3,0,6,h);g.fillRect(0,h*.45,w,6);g.strokeStyle='#3a2716';g.lineWidth=10;g.strokeRect(0,0,w,h)})});
  [[-1,0],[1,0],[0,-1]].forEach(([sx,sz])=>{for(const o of [-300,300]){const m=new T.Mesh(new T.PlaneGeometry(120,180),win);
    if(sx){m.position.set(sx*(HALL-1),220,o);m.rotation.y=-sx*Math.PI/2}else{m.position.set(o,220,sz*(HALL-1))}scene.add(m);
    const cur=mat('#5a1f1c',{roughness:1});for(const cs of [-1,1]){const c=new T.Mesh(new T.BoxGeometry(34,230,8),cur);if(sx){c.position.set(sx*(HALL-6),205,o+cs*76)}else{c.position.set(o+cs*76,205,sz*(HALL-6))}scene.add(c)}}});
  // 책장
  const shelfM=mat('#3e2716',{roughness:.7});const bookCols=['#7a2e2e','#2f4f6f','#6b5a2a','#2e5a3e','#5a3a6b','#8a5a2a'];
  for(const x of [-560,-300,300,560]){const sh=new T.Group();const frame=new T.Mesh(new T.BoxGeometry(180,240,40),shelfM);frame.position.y=120;sh.add(frame);
    for(let r=0;r<4;r++){let bx=-80;let q=0;while(bx<78){const bw=5+((q*7+r*3)%6);const bh=34+((q*11+r)%14);const bk=new T.Mesh(new T.BoxGeometry(bw,bh,30),mat(bookCols[(q+r)%6],{roughness:.8}));bk.position.set(bx+bw/2,24+r*56+bh/2,4);sh.add(bk);bx+=bw+1;q++}}
    sh.position.set(x,0,HALL-24);sh.rotation.y=Math.PI;scene.add(sh)}
  // 화분
  const pot=mat('#6b4a32'),leaf=mat('#2f5a34',{roughness:.9});
  [[-800,-800],[800,-800],[-800,800],[800,800],[-820,0],[820,0]].forEach(([x,z])=>{const g=new T.Group();const p=new T.Mesh(new T.CylinderGeometry(22,16,40,16),pot);p.position.y=20;g.add(p);
    for(let k=0;k<7;k++){const s=new T.Mesh(new T.SphereGeometry(26-k*2,12,10),leaf);s.position.set(Math.sin(k*2.3)*14,60+k*16,Math.cos(k*2.3)*14);g.add(s)}g.position.set(x,0,z);scene.add(g)});
  // 등: 가운데 테이블 위 큰 등 + 구석의 따뜻한 빛
  pendant(0,0,1.25);
  [[-600,-600],[600,600],[600,-600],[-600,600]].forEach(([x,z])=>{const l=new T.PointLight('#ffb36b',.35,900,2);l.position.set(x,300,z);scene.add(l)});
}
function pendant(x,z,s=1,col='#e8b84a'){const g=new T.Group();const cord=new T.Mesh(new T.CylinderGeometry(.6,.6,150,6),mat('#111'));cord.position.y=345;g.add(cord);
  const shade=new T.Mesh(new T.ConeGeometry(30*s,24*s,32,1,true),new T.MeshStandardMaterial({color:new T.Color('#2e3a2c').convertSRGBToLinear(),side:T.DoubleSide,roughness:.5,metalness:.3}));shade.position.y=270;g.add(shade);
  const bulb=new T.Mesh(new T.SphereGeometry(7*s,16,12),new T.MeshBasicMaterial({color:new T.Color('#ffe2a8').convertSRGBToLinear()}));bulb.position.y=262;g.add(bulb);
  const ring=new T.Mesh(new T.TorusGeometry(30*s,1.2,6,32),new T.MeshBasicMaterial({color:new T.Color(col).convertSRGBToLinear()}));ring.rotation.x=Math.PI/2;ring.position.y=258;g.add(ring);
  g.position.set(x,0,z);scene.add(g);return g}

/* ================= 미니게임 테이블 (게임마다 따로) ================= */
const ST_IDS=['balloon','vault','race','count','hold','bomb','auction','rps'];
const ST_R=500;
const STYLE={balloon:{felt:'#7a3b22',wood:'#c99a6a',shape:'round'},vault:{felt:'#30363f',wood:'#1f2329',shape:'square'},race:{felt:'#2c5a3c',wood:'#5b3b23',shape:'long'},count:{felt:'#23405e',wood:'#3a2a1c',shape:'round'},
  hold:{felt:'#5a2626',wood:'#2a1a12',shape:'octa'},bomb:{felt:'#3a1414',wood:'#1a1a1a',shape:'round'},auction:{felt:'#4a3a12',wood:'#6b4a2a',shape:'square'},rps:{felt:'#2e2e5a',wood:'#c9c2b4',shape:'round'}};
const stations=new Map();
function stFrame(id){const k=ST_IDS.indexOf(id);const a=k*2*Math.PI/ST_IDS.length+Math.PI/ST_IDS.length;const x=Math.sin(a)*ST_R,z=Math.cos(a)*ST_R;return {x,z,ry:Math.atan2(-x,-z)}}
function stLocal(id,lx,ly,lz){const f=stFrame(id);const c=Math.cos(f.ry),s=Math.sin(f.ry);return V(f.x+lx*c+lz*s,ly,f.z-lx*s+lz*c)}
function buildStations(){ST_IDS.forEach(id=>{const f=stFrame(id),st=STYLE[id];const g=new T.Group();g.position.set(f.x,0,f.z);g.rotation.y=f.ry;
  const wood=mat(st.wood,{roughness:.5}),felt=mat(st.felt,{roughness:.95});
  let top,fl;
  if(st.shape==='round'||st.shape==='octa'){const seg=st.shape==='octa'?8:56;top=new T.Mesh(new T.CylinderGeometry(52,51,4,seg),wood);fl=new T.Mesh(new T.CylinderGeometry(47,47,.4,seg),felt)}
  else if(st.shape==='square'){top=new T.Mesh(new T.BoxGeometry(104,4,104),wood);fl=new T.Mesh(new T.BoxGeometry(94,.4,94),felt)}
  else{top=new T.Mesh(new T.BoxGeometry(150,4,96),wood);fl=new T.Mesh(new T.BoxGeometry(140,.4,86),felt)}
  top.position.y=TY-2;fl.position.y=TY+.1;top.castShadow=fl.receiveShadow=top.receiveShadow=true;
  const leg=new T.Mesh(new T.CylinderGeometry(7,10,TY-4,16),wood);leg.position.y=(TY-4)/2;
  const rug=new T.Mesh(new T.CircleGeometry(120,48),mat(st.felt,{roughness:1}));rug.rotation.x=-Math.PI/2;rug.position.y=.3;rug.receiveShadow=true;
  const props=new T.Group();
  // 미니게임 이름 간판(테이블 뒤 받침대)
  const look=mgLook(id);const sign=new T.Mesh(new T.PlaneGeometry(70,18),new T.MeshBasicMaterial({map:ctex('sign'+id,512,132,(gg,w,h)=>{gg.fillStyle=look[1];rr(gg,0,0,w,h,30);gg.fill();gg.fillStyle='#fbf8f0';gg.font=`76px ${FONT_D}`;gg.textAlign='center';gg.textBaseline='middle';gg.fillText(MG[id]?MG[id].name:id,w/2,h/2+4)}),transparent:true}));
  sign.position.set(0,172,96);sign.rotation.y=Math.PI;
  const post=new T.Mesh(new T.CylinderGeometry(1.2,1.2,120,8),mat('#222'));post.position.set(0,145,82);
  g.add(rug,top,fl,leg,props,sign);scene.add(g);stations.set(id,{g,props,parts:{}});
  pendant(f.x,f.z,.8,look[0])})}
let mgSpot;
function stationSeat(id,i){const n=S.seats.length,v=viewSeat();const r=(i-v+n)%n;const phi=Math.PI+r*2*Math.PI/n;const d=78;const lx=Math.sin(phi)*d,lz=Math.cos(phi)*d;return stLocal(id,lx,0,lz)}
function stationShot(id){SHOTS.station={p:stLocal(id,0,168,-178),l:stLocal(id,0,TY-4,18),fov:50};
  if(W/H<1.1)SHOTS.station.p=stLocal(id,0,215,-220);
  mgSpot.position.copy(stLocal(id,0,320,-40));mgSpot.target.position.copy(stLocal(id,0,TY,0));mgSpot.intensity=1.1}

/* --- 미니게임 소품: 상태(S.mg)를 그대로 그린다 --- */
function hsl(h,s,l){return new T.Color().setHSL(h/360,s,l).convertSRGBToLinear()}
function propCard(st,key,c,lx,ly,lz,yaw=0,sc=1,pick,down=false){const id=st.id;const p=stLocal(id,lx,TY+.6+ly,lz);const f=stFrame(id);const w=f.ry+Math.PI+yaw;
  return want('m:'+key,()=>makeCard(c),p,down?[Math.PI/2,0,-w]:[-Math.PI/2,0,w],sc,{lift:6,pick,from:stLocal(id,0,TY+30,0)})}
function layoutMG(){if(!S||S.phase!=='mg'||!S.mg)return;const m=S.mg,id=m.id;if(!stations.has(id))return;const st={id};const f=stFrame(id);const st0=stations.get(id);const P=st0.parts;
  
  if(id==='balloon'){if(!P.bal){const b=new T.Mesh(new T.SphereGeometry(10,32,24),new T.MeshStandardMaterial({color:'#e8853a',roughness:.35}));b.castShadow=true;const knot=new T.Mesh(new T.ConeGeometry(1.6,3,12),b.material);knot.position.y=-10.5;knot.rotation.x=Math.PI;b.add(knot);
      const str=new T.Mesh(new T.CylinderGeometry(.15,.15,40,4),mat('#d8cfc0'));st0.props.add(b,str);P.bal=b;P.str=str}
    const r=Math.min(1,m.total/BLIMIT);const s=.8+r*2.1;P.bal.userData.ts=s;P.bal.material.color.copy(hsl(130-130*r,.7,.52));
    P.bal.position.set(0,TY+40+s*10,0);P.str.position.set(0,TY+20+s*2,0);P.str.scale.y=(s*10)/40+.3;
    m.pile.slice(-6).forEach((c,k)=>propCard(st,'bp'+c,c,(k-2.5)*2.2,k*.03,-14+((k*13)%5),((k*37)%11-5)*.08))}
  if(id==='hold'){if(!P.tray){const tr=new T.Mesh(new T.BoxGeometry(40,3,28),mat('#1d3a2a'));tr.position.y=TY+1.5;const rim=new T.Mesh(new T.BoxGeometry(42,5,30),mat('#2a1a12'));rim.position.y=TY+1;st0.props.add(rim,tr);
      const d1=makeDie();d1.scale.setScalar(2.4);const d2=makeDie();d2.scale.setScalar(2.4);st0.props.add(d1,d2);P.d1=d1;P.d2=d2}
    const L=m.last;P.d1.position.set(L&&L.b!=null?-7:0,TY+6.2,0);P.d1.rotation.set(...dieEuler(L?L.a:1));P.d2.visible=!!(L&&L.b!=null);if(L&&L.b!=null){P.d2.position.set(7,TY+6.2,0);P.d2.rotation.set(...dieEuler(L.b))}}
  if(id==='bomb'){const alive=m.alive.length;m.lay.forEach((c,k)=>{if(!c)return;const n=m.lay.length;const a=(k-(n-1)/2)*.32;propCard(st,'bl'+k+'_'+c,null,Math.sin(a)*26,0,-Math.cos(a)*6+10,a,1.3,{kind:'bomb',k},true)});
    Object.keys(m.flip).forEach(j=>{const sp=stationSeat(id,+j);const v=sp.clone().sub(stLocal(id,0,0,0)).multiplyScalar(.55);const p=stLocal(id,0,0,0).add(v);want('m:bf'+m.flip[j].c,()=>makeCard(m.flip[j].c),V(p.x,TY+.6,p.z),[-Math.PI/2,0,Math.atan2(v.x,v.z)+Math.PI],1.4,{lift:8})})}
  if(id==='auction'){m.pot.forEach((p,k)=>propCard(st,'ap'+p.c,p.c,(k-(m.pot.length-1)/2)*9,0,0,0,1.5));
    m.prizes.forEach((p,k)=>{if(!p)return;propCard(st,'aq'+p.c,p.up?p.c:null,(k-2)*8.5,0,26,0,1.1,null,!p.up)});
    Object.keys(m.won).forEach(j=>m.won[j].forEach((c,k)=>{const sp=stationSeat(id,+j);const v=sp.clone().sub(stLocal(id,0,0,0)).multiplyScalar(.6);const p=stLocal(id,0,0,0).add(v);want('m:aw'+c,()=>makeCard(c),V(p.x+k*1.5,TY+.6+k*.05,p.z),[-Math.PI/2,0,Math.atan2(v.x,v.z)+Math.PI],.9,{lift:8})}))}
  if(id==='vault'){if(!P.doors){P.doors=[1,2,3].map(z=>{const g=new T.Group();const bx=new T.Mesh(new T.BoxGeometry(22,30,16),mat('#4a5260',{roughness:.35,metalness:.6}));bx.position.y=15;bx.castShadow=true;
      const face=new T.Mesh(new T.PlaneGeometry(18,26),new T.MeshStandardMaterial({map:ctex('vd'+z,128,180,(gg,w,h)=>{gg.fillStyle='#6b7584';gg.fillRect(0,0,w,h);gg.strokeStyle='#2a2f37';gg.lineWidth=6;gg.strokeRect(8,8,w-16,h-16);gg.beginPath();gg.arc(w/2,h*.62,30,0,7);gg.stroke();gg.fillStyle='#e8b84a';gg.font=`64px ${FONT_D}`;gg.textAlign='center';gg.fillText(z,w/2,64)}),roughness:.4,metalness:.4}));
      face.position.set(0,15,-8.1);face.rotation.y=Math.PI;const lamp=new T.Mesh(new T.SphereGeometry(2.2,12,8),new T.MeshBasicMaterial({color:'#3a1010'}));lamp.position.set(0,33,-2);g.add(bx,face,lamp);g.userData.lamp=lamp;g.position.set((2-z)*30,TY,8);st0.props.add(g);setPick(bx,{kind:'door',z});return g})}
    const hit=m.last?m.last.zones:[];P.doors.forEach((d,k)=>{d.userData.lamp.material.color.set(hit.includes(k+1)?'#ff4d4d':'#3a1010')})}
  if(id==='count'){if(!P.stand){const s=new T.Group();const bk=new T.Mesh(new T.BoxGeometry(24,32,2),mat('#2a1a12'));bk.position.y=TY+18;const c=makeCard(null);c.scale.setScalar(3);c.position.set(0,TY+18,-1.2);c.rotation.y=Math.PI;s.add(bk,c);st0.props.add(s);P.stand=s;P.card=c}}
  if(id==='race'){if(!P.board){const bd=new T.Mesh(new T.PlaneGeometry(120,70),new T.MeshStandardMaterial({map:ctex('raceboard',640,380,(gg,w,h)=>{gg.fillStyle='#f3ecdc';gg.fillRect(0,0,w,h);const lw=(w-120)/5;
        ['밖','1','2','3','결승'].forEach((t,c)=>{gg.fillStyle=c===4?'#f2d27a':c===0?'#ddd3c0':'#e8dfcc';gg.fillRect(100+c*lw,12,lw-6,h-24);gg.fillStyle='#8a7f6a';gg.font=`28px ${FONT_D}`;gg.textAlign='center';gg.fillText(t,100+c*lw+lw/2,h-24)});
        SUITS.forEach((s,k)=>{gg.fillStyle=INKC[s];gg.font=`56px ${FONT_D}`;gg.textAlign='center';gg.textBaseline='middle';gg.fillText(SYM[s],50,40+k*80)})}),roughness:.8}));
      bd.rotation.x=-Math.PI/2;bd.rotation.z=Math.PI;bd.position.y=TY+.4;st0.props.add(bd);P.board=bd;P.horse={};SUITS.forEach(s=>{const h=new T.Mesh(new T.CylinderGeometry(3.4,3.8,6,20),mat(SUITCOL[s],{roughness:.4}));h.castShadow=true;st0.props.add(h);P.horse[s]=h})}
    SUITS.forEach((s,k)=>{const h=P.horse[s];h.userData.tp=V(-((100+m.pos[s]*104+52)*.1875-60),TY+3.4,35-(40+k*80)*70/380)});
    m.pile.slice(-1).forEach(c=>propCard(st,'rp'+c,c,-66,0,-22,0,1.3))}
}
function tickMG(dt,t){if(!S||S.phase!=='mg'||!S.mg)return;const m=S.mg,st0=stations.get(m.id);if(!st0)return;const P=st0.parts;const a=1-Math.exp(-dt*6);
  if(P.bal){const s=P.bal.scale.x+((P.bal.userData.ts||1)-P.bal.scale.x)*a;P.bal.scale.set(s,s*1.12,s);P.bal.position.x=Math.sin(t*1.3)*.8;P.bal.rotation.z=Math.sin(t*1.1)*.05}
  if(P.horse)for(const s of SUITS){const h=P.horse[s];if(h.userData.tp){h.position.lerp(h.userData.tp,a);h.position.y=h.userData.tp.y+Math.max(0,Math.sin(t*6+SUITS.indexOf(s)))*.6}}
  if(P.card&&m.id==='count'){const now=Date.now();let c=null;if(now>=m.t0){const k=Math.floor((now-m.t0)/CFLIP);c=now>=countOpenAt(m)?m.dec:m.seq[Math.min(k,m.seq.length-1)]}
    if(P.card.userData.cur!==c){P.card.userData.cur=c;const f=P.card.children[0];f.material=new T.MeshStandardMaterial({map:c?faceTex(c):backTex(),roughness:.6});P.card.rotation.y=Math.PI+.6}
    P.card.rotation.y+=(Math.PI-P.card.rotation.y)*Math.min(1,dt*10)}}
function clearMG(){for(const [,st] of stations){while(st.props.children.length)st.props.remove(st.props.children[0]);for(const k in st.parts)delete st.parts[k]}}

      if(m.step==='guard'){const need=m.armL?2:1;const zs=ui.vz||[];me_=amLead?`<div class="line">뒤질 금고를 ${need}곳 고르세요</div><div class="doors">${[1,2,3].map(z=>`<button class="door ${zs.includes(z)?'on':''}" data-a="vz" data-z="${z}">${z}</button>`).join('')}</div><div class="bigbtns"><button class="btn primary" data-a="vgo" ${zs.length===need?'':'disabled'}>수색!</button>${!m.armL?`<button class="btn" data-a="varm" ${selItem?'':'disabled'}>아이템: 2곳${itemHint}</button>`:''}</div>`:`<div class="line">경비원이 고르는 중…</div>`}}
    body=`<div class="line">${m.round}/${m.max}판 · ${isR?'선':'경비원'} <strong>${nm(L)}</strong></div>
     <div class="chips"><span class="chip lead">${nm(L)} · ${isR?'선':'경비원'}</span>${m.alive.map(k=>`<span class="chip">${nm(k)}${m.step!=='save'&&m.picks[k]&&isR?' ✓':''}</span>`).join('')}${m.out.flat().map(k=>`<span class="chip out">${nm(k)}</span>`).join('')}</div>${me_}`}
  if(m.id==='count'){const now=Date.now();const k=Math.floor((now-m.t0)/CFLIP);const open=now>=countOpenAt(m);let st;

   <div class="scr-foot"><div class="scr-box clubbox">${mc('C11')}<div class="txt"><strong>♣ · 미니게임 바꾸기</strong>${clubTxt}${clubBtns?`<div class="clubbtns">${clubBtns}</div>`:''}${kPick}</div></div>

   <div class="alert" aria-hidden="true"><div class="frame"><svg viewBox="0 0 200 200" fill="none" stroke="#ff4d4d" stroke-width="10" stroke-linejoin="round"><path d="M40 30h100l20 20v120H40z"/><path d="M70 30v42h56V30"/><rect x="62" y="104" width="76" height="66" rx="6"/><path d="M106 40v22"/><path d="M28 28l144 144M172 28L28 172" stroke-width="16" stroke-linecap="round"/></svg></div></div>`}
let SC_LOOK=id=>({hold:['#f0b48f','#cf6f48'],bomb:['#f7a3a3','#c94242'],auction:['#f2d27a','#c79a1c'],balloon:['#ffb35c','#e8853a'],rps:['#a9bdff','#6a7fe0'],vault:['#b9c3d6','#6f7d99'],count:['#9cc3ea','#4f86c6'],race:['#8fd0a4','#3f9a63']}[id]||['#cfd4dc','#7b8494']);

    else{pill=`${nm(P.attacker)} → ${nm(P.target)} · ${cname(P.card)} 공격 · ${left}초`;pillWait=true}}

    extra=`<div class="panel" style="position:absolute;left:20px;top:74px;width:260px;pointer-events:auto"><div style="font-size:13px;letter-spacing:1px;color:var(--brass);margin-bottom:8px">미니게임 결과</div>${(S.lastRank||[]).map((g,k)=>`<div style="display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin:4px 0"><span class="disp" style="font-size:${k?18:24}px;color:${k?'var(--muted)':'var(--brass)'}">${k+1}위</span><span>${g.map(nm).join(' · ')}</span></div>`).join('')}</div>
     <div style="position:absolute;left:50%;top:${window.innerWidth<=720?120:96}px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:8px 12px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--line);max-width:94vw;pointer-events:auto"><span style="font-size:13px;color:var(--muted)">고르는 순서</span>${Rw.order.map((k,j)=>`<span class="chip" style="font-size:12px;${j===Rw.pi?'background:var(--brass);color:var(--brass-ink);border-color:var(--brass)':j<Rw.pi?'opacity:.4':''}">${nm(k)}</span>`).join('')}</div>`;handTuck=false}

    action('qtoken',{s:su});const nums=p.hand.filter(x=>U(x)===su&&!isItem(x));if(nums.length<cost)UI.toast(`${SNAME[su]} 숫자 카드가 ${cost}장 필요해요 (지금 ${nums.length}장)`);else{const e=canMakeToken(S,i,nums.sort((a,b)=>R(a)-R(b)).slice(0,cost));if(e)UI.toast(e)}return}
  if(!isItem(c)){UI.toast('숫자 카드는 토큰 칸에 놓아 토큰을 만들어요');return}

  const su=U(c),r=R(c);
  if(su==='S'){if(z.kind!=='seat'){UI.toast('♠ 공격 카드는 공격할 상대에게 끌어 놓으세요');return}
    if(z.i===i)return;if(r===11){ui={mode:'target',card:c};action('atk',{t:z.i});return}

  if(su==='H'&&r===12){ui={mode:'HQ',card:c,hq:new Set()};sel.clear();UI.render();return}
  if(su==='D'&&r===11){act(st=>{if(st.phase!=='main'||st.turn.seat!==i||st.turn.item)return false;useDJ(st,i,c)});return}
  if(su==='D'){sel.clear();sel.add(c);UI.toast(`${cname(c)}는 토큰 칸에 숫자 카드와 함께 써요`);UI.render();return}
  UI.toast(su==='H'?'♥J·♥K는 남의 공격을 막을 때 써요':'♣는 미니게임을 정할 때 써요')}
function action(a,d){const i=ctl,s=selArr();const guard=(st,ph)=>st.phase===ph;
  switch(a){
    case 'sit':act(st=>{if(st.phase!=='lobby'||st.seats.length>=5)return false;st.seats.push({uid:me});if(myDisplayName){st.names=st.names||{};st.names[me]=myDisplayName}log(st,'자리에 한 명 앉았다.')});break;

    case 'start':act(st=>{if(st.phase!=='lobby'||st.seats.length<2)return false;startGame(st)});break;
    case 'restart':act(st=>{if(st.phase!=='ended')return false;startGame(st)});break;
    case 'tolobby':act(st=>{const seats=st.seats.map(p=>({uid:p.uid}));const nm=st.names;for(const k of Object.keys(st))delete st[k];Object.assign(st,newLobby());st.seats=seats;if(nm)st.names=nm});break;
